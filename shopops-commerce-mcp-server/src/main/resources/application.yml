server:
  port: ${SHOPOPS_COMMERCE_MCP_PORT:8090}

spring:
  application:
    name: shopops-commerce-mcp-server

shopops:
  mcp:
    commerce:
      bearer-token: ${SHOPOPS_COMMERCE_MCP_TOKEN:}
      server-name: shopops-commerce-mcp-server
      server-version: 0.1.0
      max-date-range-days: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
