name: ShopOps CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_formal_benchmark:
        description: "Run held-out ShopOpsBench formal integration job"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shopops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify frozen benchmark manifest
        run: python3 scripts/verify-benchmark-manifest.py

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress -pl shopops-admin -am test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore
          retention-days: 7

  benchmark-integration:
    name: ShopOpsBench formal integration
    if: github.event_name == 'workflow_dispatch' && inputs.run_formal_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopops_agent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: shopops
          RABBITMQ_DEFAULT_PASS: shopops
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify frozen benchmark manifest
        run: python3 scripts/verify-benchmark-manifest.py

      - name: Run formal held-out benchmark integration
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl shopops-admin -am
          -Dshopops.formal.it=true
          -Dshopops.jdbc.it=true
          -Dshopops.rabbitmq.it=true
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dspring.rabbitmq.host=127.0.0.1
          -Dspring.rabbitmq.port=5672
          -Dspring.rabbitmq.username=shopops
          -Dspring.rabbitmq.password=shopops
          -Dtest=FormalTaskBenchmarkIntegrationTest,FormalIdempotencyBenchmarkIntegrationTest,FormalRecoveryBenchmarkIntegrationTest,FormalGovernanceBenchmarkIntegrationTest,JdbcRefundIdempotencyIntegrationTest,JdbcRefundRecoveryIntegrationTest,JdbcGovernanceIntegrationTest,AgentTaskRabbitDispatchIntegrationTest
          test

      - name: Aggregate formal benchmark evidence
        if: always()
        run: python3 scripts/aggregate-shopopsbench-formal.py --formal-root shopops-admin/target/benchmark/formal --output artifacts/evaluation/formal-ci

      - name: Upload formal benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopopsbench-formal-evidence
          path: |
            **/target/benchmark/formal/**
            **/target/surefire-reports/**
            artifacts/evaluation/formal-ci/**
          if-no-files-found: ignore
          retention-days: 30

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: shopops-admin-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shopops-admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React admin
        run: npm run build

  docker-build:
    name: Docker demo image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -p shopops-demo -f deploy/docker-compose.demo.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: shopops-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
