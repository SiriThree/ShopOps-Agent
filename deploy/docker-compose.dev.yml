services:
  mysql:
    image: mysql:8.4
    container_name: shopops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopops_agent
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - shopops_mysql_data:/var/lib/mysql
      - ../sql/shopops_p0_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../sql/shopops_p0_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: shopops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: shopops-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shopops
      RABBITMQ_DEFAULT_PASS: shopops
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  shopops_mysql_data:

