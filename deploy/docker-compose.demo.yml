services:
  shopops-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: shopops_agent
      MYSQL_USER: shopops
      MYSQL_PASSWORD: shopops
      MYSQL_ROOT_PASSWORD: shopops_root
    ports:
      - "${SHOPOPS_MYSQL_PORT:-3306}:3306"
    volumes:
      - shopops-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ushopops -pshopops --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  shopops-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BUILDER_IMAGE: ${SHOPOPS_DOCKER_BUILDER_IMAGE:-eclipse-temurin:17-jdk}
        RUNTIME_IMAGE: ${SHOPOPS_DOCKER_RUNTIME_IMAGE:-eclipse-temurin:17-jre}
    image: shopops-agent:demo
    restart: unless-stopped
    ports:
      - "${SHOPOPS_DEMO_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      SHOPOPS_PERSISTENCE: jdbc
      SHOPOPS_DATASOURCE_URL: jdbc:mysql://shopops-mysql:3306/shopops_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SHOPOPS_DATASOURCE_USERNAME: shopops
      SHOPOPS_DATASOURCE_PASSWORD: shopops
      SHOPOPS_DATASOURCE_INITIALIZATION_FAIL_TIMEOUT: 30000
      SHOPOPS_FLYWAY_ENABLED: "true"
      SHOPOPS_CONNECTOR_ORDER_SUMMARY_FILE: /app/docs/demo-data/olist/order-summary-olist.json
      SHOPOPS_CONNECTOR_NEGATIVE_COMMENTS_FILE: /app/docs/demo-data/olist/negative-comments-olist.json
      SHOPOPS_CONNECTOR_PRODUCT_CANDIDATES_FILE: /app/docs/demo-data/olist/product-candidates-olist.json
      SHOPOPS_AUTH_TOKEN_SECRET: ${SHOPOPS_AUTH_TOKEN_SECRET:-shopops-demo-token-secret}
      SHOPOPS_CONNECTOR_CREDENTIAL_SECRET: ${SHOPOPS_CONNECTOR_CREDENTIAL_SECRET:-shopops-demo-connector-secret}
      SHOPOPS_FEISHU_SYNC_ENABLED: ${SHOPOPS_FEISHU_SYNC_ENABLED:-false}
      SHOPOPS_FEISHU_SYNC_WEBHOOK_URL: ${SHOPOPS_FEISHU_SYNC_WEBHOOK_URL:-}
      SHOPOPS_MODEL_OPENAI_COMPATIBLE_ENABLED: ${SHOPOPS_MODEL_OPENAI_COMPATIBLE_ENABLED:-false}
      SHOPOPS_MODEL_OPENAI_COMPATIBLE_BASE_URL: ${SHOPOPS_MODEL_OPENAI_COMPATIBLE_BASE_URL:-http://host.docker.internal:11434/v1}
      SHOPOPS_MODEL_OPENAI_COMPATIBLE_API_KEY: ${SHOPOPS_MODEL_OPENAI_COMPATIBLE_API_KEY:-}
      SHOPOPS_MODEL_OPENAI_COMPATIBLE_DEFAULT_MODEL: ${SHOPOPS_MODEL_OPENAI_COMPATIBLE_DEFAULT_MODEL:-gpt-4o-mini}
    depends_on:
      shopops-mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  shopops-mysql-data:
