<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopOps Agent Tasks</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee6;
      --text: #1f2933;
      --muted: #667085;
      --ink: #111827;
      --green: #168a5b;
      --red: #c24132;
      --amber: #b7791f;
      --teal: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }

    button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #ffffff;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
    }

    input, select {
      min-height: 34px;
      padding: 6px 9px;
    }

    textarea {
      min-height: 82px;
      padding: 9px;
      resize: vertical;
      line-height: 1.45;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
    }

    .sidebar {
      background: #20242b;
      color: #f8fafc;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand { display: grid; gap: 3px; }
    .brand strong { font-size: 18px; font-weight: 700; }
    .brand span { color: #b8c0cc; font-size: 12px; }

    .nav { display: grid; gap: 6px; }

    .nav a {
      color: #cdd5df;
      text-decoration: none;
      border-radius: 6px;
      padding: 9px 10px;
    }

    .nav a.active {
      background: #343a44;
      color: #ffffff;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      min-width: 0;
      padding: 18px 24px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(360px, 680px);
      gap: 18px;
      align-items: end;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .toolbar {
      padding: 16px 24px;
      display: grid;
      gap: 14px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric span { color: var(--muted); font-size: 12px; }

    .metric strong {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .quick-actions span {
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      min-width: 0;
      padding: 0 24px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 14px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title h2 {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .tasks-column { min-width: 0; }

    table {
      width: 100%;
      min-width: 960px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9fafb;
      color: #475467;
      font-size: 12px;
      font-weight: 600;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fbfa; }
    tbody tr.selected { background: #eef6f4; }

    .summary-cell {
      max-width: 260px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #eef2f6;
      color: #344054;
    }

    .badge.success {
      background: #e7f6ef;
      color: var(--green);
    }

    .badge.failed, .badge.failure {
      background: #fdecea;
      color: var(--red);
    }

    .badge.running, .badge.pending {
      background: #fff6df;
      color: var(--amber);
    }

    .side {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 14px;
    }

    .detail-box {
      max-height: 390px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      padding: 10px;
      color: #344054;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .event-list {
      display: grid;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      gap: 9px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .event-line {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr) 76px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid #eef1f4;
      padding-bottom: 8px;
    }

    .event-line:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .event-line strong {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .status-line {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 8px 8px;
    }

    .pager-actions { display: flex; gap: 8px; }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar, .content { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
      .side { position: static; }
    }

    @media (max-width: 720px) {
      .topbar, .toolbar, .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .context-grid, .filters, .metrics, .form-row {
        grid-template-columns: 1fr 1fr;
      }

      .filters button, .context-grid button { width: 100%; }

      .table-wrap {
        overflow: visible;
      }

      table {
        min-width: 0;
      }

      thead {
        display: none;
      }

      tbody {
        display: grid;
        gap: 8px;
      }

      tbody tr {
        display: grid;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      tbody td {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        white-space: normal;
      }

      tbody td::before {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      tbody td:nth-child(1)::before { content: "Task"; }
      tbody td:nth-child(2)::before { content: "Type"; }
      tbody td:nth-child(3)::before { content: "Status"; }
      tbody td:nth-child(4)::before { content: "User"; }
      tbody td:nth-child(5)::before { content: "Report"; }
      tbody td:nth-child(6)::before { content: "Trace"; }
      tbody td:nth-child(7)::before { content: "Created"; }
      tbody td:nth-child(8)::before { content: "Summary"; }

      .summary-cell {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>ShopOps Agent</strong>
        <span>Admin Console</span>
      </div>
      <nav class="nav" aria-label="Admin navigation">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/auth.html">Auth</a>
        <a class="active" href="/admin/tasks.html">Agent Tasks</a>
        <a href="/admin/audit.html">Audit Center</a>
        <a href="/admin/reports.html">Reports</a>
        <a href="/admin/tools.html">Tools</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Agent Tasks</h1>
          <div class="subtitle">Operational task queue, execution status, and event stream</div>
        </div>
        <form class="context-grid" id="contextForm">
          <label>Tenant
            <input id="tenantId" value="1" inputmode="numeric">
          </label>
          <label>Shop
            <input id="shopId" value="1" inputmode="numeric">
          </label>
          <label>User
            <input id="userId" value="1" inputmode="numeric">
          </label>
          <label>Roles
            <input id="roles" value="ADMIN">
          </label>
          <button class="primary" type="submit">Refresh</button>
          <button id="resetContext" type="button">Reset</button>
        </form>
      </header>

      <section class="toolbar">
        <div class="metrics" id="metrics"></div>
        <form class="filters" id="filterForm">
          <label>Status
            <select id="status">
              <option value="">All</option>
              <option value="PENDING">Pending</option>
              <option value="RUNNING">Running</option>
              <option value="SUCCESS">Success</option>
              <option value="FAILED">Failed</option>
            </select>
          </label>
          <label>Type
            <input id="taskType" placeholder="daily_review">
          </label>
          <label>Task No
            <input id="taskNo">
          </label>
          <label>User ID
            <input id="filterUserId" inputmode="numeric">
          </label>
          <label>Trace ID
            <input id="traceId">
          </label>
          <label>Report ID
            <input id="reportId" inputmode="numeric">
          </label>
          <button class="primary" type="submit">Search</button>
          <button id="resetFilters" type="button">Reset</button>
        </form>
        <div class="quick-actions" aria-label="Task quick filters">
          <span>Quick filters</span>
          <button type="button" data-quick-filter="running">Running</button>
          <button type="button" data-quick-filter="failed">Failed</button>
          <button type="button" data-quick-filter="success">Success</button>
          <button type="button" data-quick-filter="clear">Clear</button>
        </div>
        <div class="status-line" id="statusLine"></div>
      </section>

      <section class="content">
        <div class="tasks-column">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Task</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>User</th>
                  <th>Report</th>
                  <th>Trace</th>
                  <th>Created</th>
                  <th>Summary</th>
                </tr>
              </thead>
              <tbody id="taskBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pageInfo">Page 1</span>
            <div class="pager-actions">
              <button id="prevPage" type="button">Previous</button>
              <button id="nextPage" type="button">Next</button>
            </div>
          </div>
        </div>

        <aside class="side">
          <section class="panel">
            <div class="panel-title">
              <h2>Create Task</h2>
              <button id="resetCreate" type="button">Reset</button>
            </div>
            <form class="form-grid" id="createForm" autocomplete="off">
              <label>Type
                <input id="createTaskType" value="daily_review" required>
              </label>
              <div class="form-row">
                <label>Start
                  <input id="startDate" type="date" required>
                </label>
                <label>End
                  <input id="endDate" type="date" required>
                </label>
              </div>
              <label>User Input
                <textarea id="userInput" required>Generate a daily operating review for the selected date range.</textarea>
              </label>
              <div class="button-row">
                <button id="requeueStale" type="button">Requeue Stale</button>
                <button class="primary" type="submit">Create</button>
              </div>
            </form>
          </section>
          <section class="panel">
            <div class="panel-title">
              <h2>Task Detail</h2>
              <div class="button-row">
                <button id="retryTask" type="button">Retry</button>
                <button id="clearDetail" type="button">Clear</button>
              </div>
            </div>
            <pre class="detail-box" id="detailBox">Select a task row</pre>
          </section>
          <section class="panel">
            <div class="panel-title">
              <h2>Recent Events</h2>
              <button id="refreshEvents" type="button">Refresh</button>
            </div>
            <div class="event-list" id="eventList"></div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const state = { pageNum: 1, pageSize: 20, total: 0, selectedTaskId: "" };
    const $ = (id) => document.getElementById(id);

    function headers() {
      return {
        "X-Tenant-Id": $("tenantId").value || "1",
        "X-Shop-Id": $("shopId").value || "1",
        "X-User-Id": $("userId").value || "1",
        "X-User-Roles": $("roles").value || "ADMIN"
      };
    }

    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const body = await response.json();
      if (body.code && body.code !== 200) {
        throw new Error(body.message || `API ${body.code}`);
      }
      return body.data;
    }

    function filters() {
      const params = new URLSearchParams();
      params.set("pageNum", state.pageNum);
      params.set("pageSize", state.pageSize);
      add(params, "status", $("status").value);
      add(params, "taskType", $("taskType").value);
      add(params, "taskNo", $("taskNo").value);
      add(params, "userId", $("filterUserId").value);
      add(params, "traceId", $("traceId").value);
      add(params, "reportId", $("reportId").value);
      return params;
    }

    function add(params, key, value) {
      if (value != null && String(value).trim() !== "") {
        params.set(key, String(value).trim());
      }
    }

    async function refreshAll() {
      setStatus("Loading tasks");
      try {
        await Promise.all([loadMetrics(), loadTasks(), loadEvents()]);
        setStatus("Tasks refreshed");
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function loadMetrics() {
      const metrics = await api("/api/admin/agent/tasks/metrics");
      $("metrics").innerHTML = [
        ["Total", metrics.total],
        ["Pending", metrics.statusBreakdown?.PENDING],
        ["Running", metrics.statusBreakdown?.RUNNING],
        ["Success", metrics.success],
        ["Failed", metrics.failed]
      ].map(([label, value]) => metric(label, value)).join("");
    }

    async function loadTasks() {
      const data = await api(`/api/admin/agent/tasks?${filters().toString()}`);
      state.total = number(data.total);
      $("taskBody").innerHTML = (data.list || []).map((task) => `
        <tr data-task-id="${escapeAttr(task.taskId)}" class="${String(task.taskId) === String(state.selectedTaskId) ? "selected" : ""}">
          <td>${escapeHtml(task.taskNo || task.taskId || "")}</td>
          <td>${escapeHtml(task.taskType || "")}</td>
          <td><span class="badge ${statusClass(task.status)}">${escapeHtml(task.status || "")}</span></td>
          <td>${escapeHtml(task.userId || "")}</td>
          <td>${escapeHtml(task.reportId || "")}</td>
          <td>${escapeHtml(task.traceId || "")}</td>
          <td>${formatTime(task.createdAt)}</td>
          <td class="summary-cell">${escapeHtml(task.resultSummary || task.errorMessage || task.userInput || "")}</td>
        </tr>
      `).join("") || `<tr><td colspan="8">No tasks found. <button type="button" data-empty-reset>Clear filters</button></td></tr>`;
      $("pageInfo").textContent = `Page ${data.pageNum || state.pageNum} / ${state.total} rows`;
      $("prevPage").disabled = state.pageNum <= 1;
      $("nextPage").disabled = state.pageNum * state.pageSize >= state.total;
    }

    async function loadEvents() {
      const data = await api("/api/admin/agent/tasks/events?pageNum=1&pageSize=8");
      $("eventList").innerHTML = (data.list || []).map((event) => `
        <div class="event-line">
          <span>${formatTime(event.createdAt)}</span>
          <strong>${escapeHtml(event.eventType || "")}</strong>
          <span class="badge ${eventStatusClass(event.eventType)}">${escapeHtml(event.toStatus || event.eventStatus || "")}</span>
        </div>
      `).join("") || `<div class="status-line">No recent task events</div>`;
    }

    async function loadDetail(taskId) {
      if (!taskId) {
        return;
      }
      state.selectedTaskId = taskId;
      $("detailBox").textContent = "Loading...";
      try {
        const data = await api(`/api/admin/agent/tasks/${encodeURIComponent(taskId)}/detail`);
        $("detailBox").textContent = JSON.stringify(data, null, 2);
        markSelectedTask();
      } catch (error) {
        $("detailBox").textContent = error.message;
      }
    }

    async function createTask(event) {
      event.preventDefault();
      setStatus("Creating task");
      try {
        const payload = {
          taskType: $("createTaskType").value.trim(),
          userInput: $("userInput").value.trim(),
          dateRange: {
            start: $("startDate").value,
            end: $("endDate").value
          }
        };
        const data = await api("/api/agent/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        state.pageNum = 1;
        state.selectedTaskId = data.taskId;
        await Promise.all([loadMetrics(), loadTasks(), loadEvents()]);
        await loadDetail(data.taskId);
        setStatus(`Created ${data.taskNo || data.taskId}`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function retrySelectedTask() {
      if (!state.selectedTaskId) {
        setStatus("Select a task first");
        return;
      }
      setStatus("Retrying task");
      try {
        const data = await api(`/api/agent/tasks/${encodeURIComponent(state.selectedTaskId)}/retry`, { method: "POST" });
        state.pageNum = 1;
        state.selectedTaskId = data.taskId;
        await Promise.all([loadMetrics(), loadTasks(), loadEvents()]);
        await loadDetail(data.taskId);
        setStatus(`Retry created ${data.taskNo || data.taskId}`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function requeueStaleTasks() {
      setStatus("Requeueing stale tasks");
      try {
        const data = await api("/api/agent/tasks/stale/requeue?queuedTimeoutMinutes=10&runningTimeoutMinutes=30&limit=20", { method: "POST" });
        await Promise.all([loadMetrics(), loadTasks(), loadEvents()]);
        $("detailBox").textContent = JSON.stringify(data, null, 2);
        setStatus(`Requeued ${data.requeuedCount || 0} stale tasks`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    function resetCreateForm() {
      $("createTaskType").value = "daily_review";
      $("userInput").value = "Generate a daily operating review for the selected date range.";
      setDefaultDates();
    }

    function setDefaultDates() {
      const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000);
      const value = yesterday.toISOString().slice(0, 10);
      $("startDate").value = value;
      $("endDate").value = value;
    }

    function applyQuickFilter(name) {
      if (name === "clear") {
        resetFilters();
        return;
      }
      $("filterForm").reset();
      if (name === "running") {
        $("status").value = "RUNNING";
      } else if (name === "failed") {
        $("status").value = "FAILED";
      } else if (name === "success") {
        $("status").value = "SUCCESS";
      }
      state.pageNum = 1;
      loadTasks();
    }

    function resetFilters() {
      $("filterForm").reset();
      state.pageNum = 1;
      loadTasks();
    }

    function resetContext() {
      $("tenantId").value = "1";
      $("shopId").value = "1";
      $("userId").value = "1";
      $("roles").value = "ADMIN";
      refreshAll();
    }

    function markSelectedTask() {
      document.querySelectorAll("tr[data-task-id]").forEach((row) => {
        row.classList.toggle("selected", String(row.dataset.taskId) === String(state.selectedTaskId));
      });
    }

    function metric(label, value) {
      return `
        <div class="metric">
          <span>${escapeHtml(label)}</span>
          <strong>${number(value)}</strong>
        </div>
      `;
    }

    function setStatus(message) {
      $("statusLine").textContent = message;
    }

    function number(value) {
      return Number(value || 0);
    }

    function formatTime(value) {
      return value ? String(value).replace("T", " ").slice(0, 19) : "";
    }

    function statusClass(value) {
      return String(value || "").toLowerCase();
    }

    function eventStatusClass(eventType) {
      return eventType === "TASK_FAILED" ? "failure" : "success";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value || "");
    }

    $("contextForm").addEventListener("submit", (event) => {
      event.preventDefault();
      refreshAll();
    });

    $("resetContext").addEventListener("click", resetContext);

    $("filterForm").addEventListener("submit", (event) => {
      event.preventDefault();
      state.pageNum = 1;
      loadTasks();
    });

    $("resetFilters").addEventListener("click", resetFilters);
    $("createForm").addEventListener("submit", createTask);
    $("resetCreate").addEventListener("click", resetCreateForm);
    $("retryTask").addEventListener("click", retrySelectedTask);
    $("requeueStale").addEventListener("click", requeueStaleTasks);
    $("refreshEvents").addEventListener("click", loadEvents);
    $("clearDetail").addEventListener("click", () => {
      state.selectedTaskId = "";
      $("detailBox").textContent = "Select a task row";
      markSelectedTask();
    });

    document.querySelector(".quick-actions").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-quick-filter]");
      if (button) {
        applyQuickFilter(button.dataset.quickFilter);
      }
    });

    $("prevPage").addEventListener("click", () => {
      if (state.pageNum > 1) {
        state.pageNum -= 1;
        loadTasks();
      }
    });

    $("nextPage").addEventListener("click", () => {
      if (state.pageNum * state.pageSize < state.total) {
        state.pageNum += 1;
        loadTasks();
      }
    });

    $("taskBody").addEventListener("click", (event) => {
      if (event.target.closest("button[data-empty-reset]")) {
        resetFilters();
        return;
      }
      const row = event.target.closest("tr[data-task-id]");
      if (row) {
        loadDetail(row.dataset.taskId);
      }
    });

    resetCreateForm();
    refreshAll();
  </script>
</body>
</html>
