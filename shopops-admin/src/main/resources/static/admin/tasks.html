<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopOps 任务队列</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee6;
      --text: #1f2933;
      --muted: #667085;
      --ink: #111827;
      --green: #168a5b;
      --red: #c24132;
      --amber: #b7791f;
      --teal: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }

    button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #ffffff;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
    }

    input, select {
      min-height: 34px;
      padding: 6px 9px;
    }

    textarea {
      min-height: 82px;
      padding: 9px;
      resize: vertical;
      line-height: 1.45;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
    }

    .sidebar {
      background: #20242b;
      color: #f8fafc;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand { display: grid; gap: 3px; }
    .brand strong { font-size: 18px; font-weight: 700; }
    .brand span { color: #b8c0cc; font-size: 12px; }

    .nav { display: grid; gap: 6px; }

    .nav a {
      color: #cdd5df;
      text-decoration: none;
      border-radius: 6px;
      padding: 9px 10px;
    }

    .nav a.active {
      background: #343a44;
      color: #ffffff;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      min-width: 0;
      padding: 18px 24px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(360px, 680px);
      gap: 18px;
      align-items: end;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .context-session {
      grid-column: 1 / -1;
      min-height: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      padding: 16px 24px;
      display: grid;
      gap: 14px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric span { color: var(--muted); font-size: 12px; }

    .metric strong {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .quick-actions span {
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      min-width: 0;
      padding: 0 24px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 14px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title h2 {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .tasks-column { min-width: 0; }

    table {
      width: 100%;
      min-width: 960px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9fafb;
      color: #475467;
      font-size: 12px;
      font-weight: 600;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fbfa; }
    tbody tr.selected { background: #eef6f4; }

    .summary-cell {
      max-width: 260px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .empty-state {
      display: grid;
      gap: 8px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      white-space: normal;
    }

    .empty-state strong {
      color: var(--ink);
      font-size: 14px;
    }

    .empty-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #eef2f6;
      color: #344054;
    }

    .badge.success {
      background: #e7f6ef;
      color: var(--green);
    }

    .badge.failed, .badge.failure {
      background: #fdecea;
      color: var(--red);
    }

    .badge.running, .badge.pending {
      background: #fff6df;
      color: var(--amber);
    }

    .side {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 14px;
    }

    .detail-box {
      max-height: 390px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      padding: 10px;
      color: #344054;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .event-list {
      display: grid;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      gap: 9px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .link-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .link-row a {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--ink);
      background: var(--panel);
      text-decoration: none;
      font-size: 13px;
    }

    .event-line {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr) 76px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid #eef1f4;
      padding-bottom: 8px;
    }

    .event-line:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .event-line strong {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .status-line {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 8px 8px;
    }

    .pager-actions { display: flex; gap: 8px; }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar, .content { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
      .side { position: static; }
    }

    @media (max-width: 720px) {
      .topbar, .toolbar, .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .context-grid, .filters, .metrics, .form-row {
        grid-template-columns: 1fr 1fr;
      }

      .filters button, .context-grid button { width: 100%; }

      .table-wrap {
        overflow: visible;
      }

      table {
        min-width: 0;
      }

      thead {
        display: none;
      }

      tbody {
        display: grid;
        gap: 8px;
      }

      tbody tr {
        display: grid;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      tbody td {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        white-space: normal;
      }

      tbody td::before {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      tbody td:nth-child(1)::before { content: "任务"; }
      tbody td:nth-child(2)::before { content: "类型"; }
      tbody td:nth-child(3)::before { content: "状态"; }
      tbody td:nth-child(4)::before { content: "用户"; }
      tbody td:nth-child(5)::before { content: "报告"; }
      tbody td:nth-child(6)::before { content: "Trace"; }
      tbody td:nth-child(7)::before { content: "创建时间"; }
      tbody td:nth-child(8)::before { content: "摘要"; }

      .summary-cell {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>ShopOps Agent</strong>
        <span>管理控制台</span>
      </div>
      <nav class="nav" aria-label="后台导航">
        <a href="/admin/dashboard.html">总览</a>
        <a href="/admin/auth.html">认证</a>
        <a class="active" href="/admin/tasks.html">任务队列</a>
        <a href="/admin/audit.html">审计中心</a>
        <a href="/admin/approvals.html">审批中心</a>
        <a href="/admin/reports.html">报告</a>
        <a href="/admin/tools.html">工具日志</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>任务队列</h1>
          <div class="subtitle">查看运营任务、执行状态和事件流</div>
        </div>
        <form class="context-grid" id="contextForm">
          <label>租户
            <input id="tenantId" value="1" inputmode="numeric">
          </label>
          <label>店铺
            <input id="shopId" value="1" inputmode="numeric">
          </label>
          <label>用户
            <input id="userId" value="1" inputmode="numeric">
          </label>
          <label>角色
            <input id="roles" value="ADMIN">
          </label>
          <button class="primary" type="submit">刷新</button>
          <button id="resetContext" type="button">重置</button>
          <div class="context-session" id="sessionLine">请求头上下文</div>
        </form>
      </header>

      <section class="toolbar">
        <div class="metrics" id="metrics"></div>
        <form class="filters" id="filterForm">
          <label>状态
            <select id="status">
              <option value="">全部</option>
              <option value="PENDING">待执行</option>
              <option value="RUNNING">运行中</option>
              <option value="SUCCESS">成功</option>
              <option value="FAILED">失败</option>
            </select>
          </label>
          <label>类型
            <input id="taskType" placeholder="daily_review">
          </label>
          <label>任务编号
            <input id="taskNo">
          </label>
          <label>用户 ID
            <input id="filterUserId" inputmode="numeric">
          </label>
          <label>Trace ID
            <input id="traceId">
          </label>
          <label>报告 ID
            <input id="reportId" inputmode="numeric">
          </label>
          <button id="taskFilterSubmit" class="primary" type="submit">查询</button>
          <button id="resetFilters" type="button">重置</button>
        </form>
        <div class="quick-actions" aria-label="任务快捷筛选">
          <span>快捷筛选</span>
          <button type="button" data-quick-filter="running">运行中</button>
          <button type="button" data-quick-filter="failed">失败</button>
          <button type="button" data-quick-filter="success">成功</button>
          <button type="button" data-quick-filter="clear">清空</button>
        </div>
        <div class="status-line" id="statusLine"></div>
      </section>

      <section class="content">
        <div class="tasks-column">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>任务</th>
                  <th>类型</th>
                  <th>状态</th>
                  <th>用户</th>
                  <th>报告</th>
                  <th>Trace</th>
                  <th>创建时间</th>
                  <th>摘要</th>
                </tr>
              </thead>
              <tbody id="taskBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pageInfo">第 1 页</span>
            <div class="pager-actions">
              <button id="prevPage" type="button">上一页</button>
              <button id="nextPage" type="button">下一页</button>
            </div>
          </div>
        </div>

        <aside class="side">
          <section class="panel">
            <div class="panel-title">
              <h2>创建任务</h2>
              <button id="resetCreate" type="button">重置</button>
            </div>
            <form class="form-grid" id="createForm" autocomplete="off">
              <label>类型
                <input id="createTaskType" value="daily_review" required>
              </label>
              <div class="form-row">
                <label>开始日期
                  <input id="startDate" type="date" required>
                </label>
                <label>结束日期
                  <input id="endDate" type="date" required>
                </label>
              </div>
              <label>用户输入
                <textarea id="userInput" required>根据所选日期范围生成每日运营复盘。</textarea>
              </label>
              <div class="button-row">
                <button id="requeueStale" type="button">重排超时任务</button>
                <button id="createTaskSubmit" class="primary" type="submit">创建</button>
              </div>
            </form>
          </section>
          <section class="panel">
            <div class="panel-title">
              <h2>任务详情</h2>
              <div class="button-row">
                <button id="copyDetail" type="button">复制</button>
                <button id="retryTask" type="button">重试</button>
                <button id="clearDetail" type="button">清空</button>
              </div>
            </div>
            <pre class="detail-box" id="detailBox">请选择一条任务</pre>
            <div class="link-row">
              <a id="openReport" href="/admin/reports.html">打开报告</a>
              <a id="openAudit" href="/admin/audit.html">打开审计</a>
              <a id="openToolLogs" href="/admin/tools.html">工具日志</a>
            </div>
          </section>
          <section class="panel">
            <div class="panel-title">
              <h2>最近事件</h2>
              <button id="refreshEvents" type="button">刷新</button>
            </div>
            <div class="event-list" id="eventList"></div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const TOKEN_KEY = "shopops.auth.token";
    const USER_KEY = "shopops.auth.user";
    const state = { pageNum: 1, pageSize: 20, total: 0, selectedTaskId: "", selectedReportId: "", selectedTraceId: "" };
    const $ = (id) => document.getElementById(id);

    function headers() {
      const result = {
        "X-Tenant-Id": $("tenantId").value || "1",
        "X-Shop-Id": $("shopId").value || "1",
        "X-User-Id": $("userId").value || "1",
        "X-User-Roles": $("roles").value || "ADMIN"
      };
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) {
        result.Authorization = `Bearer ${token}`;
      }
      return result;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const body = await response.json();
      if (body.code && body.code !== 200) {
        throw new Error(body.message || `API ${body.code}`);
      }
      return body.data;
    }

    function filters() {
      const params = new URLSearchParams();
      params.set("pageNum", state.pageNum);
      params.set("pageSize", state.pageSize);
      add(params, "status", $("status").value);
      add(params, "taskType", $("taskType").value);
      add(params, "taskNo", $("taskNo").value);
      add(params, "userId", $("filterUserId").value);
      add(params, "traceId", $("traceId").value);
      add(params, "reportId", $("reportId").value);
      add(params, "taskId", state.selectedTaskId);
      return params;
    }

    function syncUrl() {
      const query = filters().toString();
      window.history.replaceState(null, "", `${window.location.pathname}${query ? `?${query}` : ""}`);
    }

    function add(params, key, value) {
      if (value != null && String(value).trim() !== "") {
        params.set(key, String(value).trim());
      }
    }

    async function refreshAll() {
      setStatus("正在加载任务");
      try {
        await Promise.all([loadMetrics(), loadTasks(), loadEvents()]);
        setStatus("任务已刷新");
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function loadMetrics() {
      const metrics = await api("/api/admin/agent/tasks/metrics");
      $("metrics").innerHTML = [
        ["总数", metrics.total],
        ["待执行", metrics.statusBreakdown?.PENDING],
        ["运行中", metrics.statusBreakdown?.RUNNING],
        ["成功", metrics.success],
        ["失败", metrics.failed]
      ].map(([label, value]) => metric(label, value)).join("");
    }

    async function loadTasks() {
      syncUrl();
      try {
        const data = await api(`/api/admin/agent/tasks?${filters().toString()}`);
        state.total = number(data.total);
        $("taskBody").innerHTML = (data.list || []).map((task) => `
          <tr data-task-id="${escapeAttr(task.taskId)}" class="${String(task.taskId) === String(state.selectedTaskId) ? "selected" : ""}">
            <td>${escapeHtml(task.taskNo || task.taskId || "")}</td>
            <td>${escapeHtml(task.taskType || "")}</td>
            <td><span class="badge ${statusClass(task.status)}">${escapeHtml(task.status || "")}</span></td>
            <td>${escapeHtml(task.userId || "")}</td>
            <td>${escapeHtml(task.reportId || "")}</td>
            <td>${escapeHtml(task.traceId || "")}</td>
            <td>${formatTime(task.createdAt)}</td>
            <td class="summary-cell">${escapeHtml(task.resultSummary || task.errorMessage || task.userInput || "")}</td>
          </tr>
        `).join("") || emptyRow(8, "暂无任务", "可以清空筛选或刷新任务队列。");
        $("pageInfo").textContent = `第 ${data.pageNum || state.pageNum} 页 / 共 ${state.total} 条`;
        $("prevPage").disabled = state.pageNum <= 1;
        $("nextPage").disabled = state.pageNum * state.pageSize >= state.total;
      } catch (error) {
        state.total = 0;
        $("taskBody").innerHTML = errorRow(8, "任务加载失败", error.message);
        $("pageInfo").textContent = "任务列表不可用";
        $("prevPage").disabled = true;
        $("nextPage").disabled = true;
        throw error;
      }
    }

    async function loadEvents() {
      const data = await api("/api/admin/agent/tasks/events?pageNum=1&pageSize=8");
      $("eventList").innerHTML = (data.list || []).map((event) => `
        <div class="event-line">
          <span>${formatTime(event.createdAt)}</span>
          <strong>${escapeHtml(event.eventType || "")}</strong>
          <span class="badge ${eventStatusClass(event.eventType)}">${escapeHtml(event.toStatus || event.eventStatus || "")}</span>
        </div>
      `).join("") || `<div class="status-line">暂无最近任务事件</div>`;
    }

    async function loadDetail(taskId) {
      if (!taskId) {
        return;
      }
      state.selectedTaskId = taskId;
      syncUrl();
      $("detailBox").textContent = "加载中...";
      try {
        const data = await api(`/api/admin/agent/tasks/${encodeURIComponent(taskId)}/detail`);
        $("detailBox").textContent = JSON.stringify(data, null, 2);
        state.selectedReportId = data.task?.reportId || "";
        state.selectedTraceId = data.task?.traceId || "";
        updateContextLinks();
        syncUrl();
        markSelectedTask();
      } catch (error) {
        $("detailBox").textContent = error.message;
      }
    }

    async function createTask(event) {
      event.preventDefault();
      setStatus("正在创建任务");
      try {
        const payload = {
          taskType: $("createTaskType").value.trim(),
          userInput: $("userInput").value.trim(),
          dateRange: {
            start: $("startDate").value,
            end: $("endDate").value
          }
        };
        const data = await api("/api/agent/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        state.pageNum = 1;
        state.selectedTaskId = data.taskId;
        syncUrl();
        await Promise.all([loadMetrics(), loadTasks(), loadEvents()]);
        await loadDetail(data.taskId);
        setStatus(`已创建 ${data.taskNo || data.taskId}`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function retrySelectedTask() {
      if (!state.selectedTaskId) {
        setStatus("请先选择一条任务");
        return;
      }
      setStatus("正在重试任务");
      try {
        const data = await api(`/api/agent/tasks/${encodeURIComponent(state.selectedTaskId)}/retry`, { method: "POST" });
        state.pageNum = 1;
        state.selectedTaskId = data.taskId;
        syncUrl();
        await Promise.all([loadMetrics(), loadTasks(), loadEvents()]);
        await loadDetail(data.taskId);
        setStatus(`重试任务已创建 ${data.taskNo || data.taskId}`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function requeueStaleTasks() {
      setStatus("正在重排超时任务");
      try {
        const data = await api("/api/agent/tasks/stale/requeue?queuedTimeoutMinutes=10&runningTimeoutMinutes=30&limit=20", { method: "POST" });
        await Promise.all([loadMetrics(), loadTasks(), loadEvents()]);
        $("detailBox").textContent = JSON.stringify(data, null, 2);
        setStatus(`已重排 ${data.requeuedCount || 0} 个超时任务`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    function resetCreateForm() {
      $("createTaskType").value = "daily_review";
      $("userInput").value = "根据所选日期范围生成每日运营复盘。";
      setDefaultDates();
    }

    function setDefaultDates() {
      const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000);
      const value = yesterday.toISOString().slice(0, 10);
      $("startDate").value = value;
      $("endDate").value = value;
    }

    function applyQuickFilter(name) {
      if (name === "clear") {
        resetFilters();
        return;
      }
      $("filterForm").reset();
      if (name === "running") {
        $("status").value = "RUNNING";
      } else if (name === "failed") {
        $("status").value = "FAILED";
      } else if (name === "success") {
        $("status").value = "SUCCESS";
      }
      state.pageNum = 1;
      loadTasks();
    }

    async function resetFilters() {
      $("filterForm").reset();
      state.pageNum = 1;
      await loadTasks();
    }

    function resetContext() {
      $("tenantId").value = "1";
      $("shopId").value = "1";
      $("userId").value = "1";
      $("roles").value = "ADMIN";
      renderSessionLine();
      refreshAll();
    }

    function applyStoredSession() {
      const session = authSession();
      if (session.user) {
        $("tenantId").value = session.user.tenantId || $("tenantId").value || "1";
        $("shopId").value = session.user.shopId || $("shopId").value || "1";
        $("userId").value = session.user.userId || $("userId").value || "1";
        $("roles").value = roleValue(session.user.roles);
      }
      renderSessionLine(session);
    }

    function renderSessionLine(session = authSession()) {
      $("sessionLine").textContent = session.token
        ? `已加载 Bearer 会话${session.user?.username ? `：${session.user.username}` : ""}`
        : "请求头上下文";
    }

    function authSession() {
      let user = null;
      try {
        user = JSON.parse(localStorage.getItem(USER_KEY) || "null");
      } catch (error) {
        user = null;
      }
      return { token: localStorage.getItem(TOKEN_KEY) || "", user };
    }

    function roleValue(roles) {
      return Array.isArray(roles) ? roles.join(",") : (roles || "ADMIN");
    }

    function markSelectedTask() {
      document.querySelectorAll("tr[data-task-id]").forEach((row) => {
        row.classList.toggle("selected", String(row.dataset.taskId) === String(state.selectedTaskId));
      });
    }

    function updateContextLinks() {
      $("openReport").href = state.selectedReportId
        ? `/admin/reports.html?reportId=${encodeURIComponent(state.selectedReportId)}`
        : "/admin/reports.html";
      $("openAudit").href = state.selectedTaskId
        ? `/admin/audit.html?source=TASK&taskId=${encodeURIComponent(state.selectedTaskId)}`
        : "/admin/audit.html";
      $("openToolLogs").href = state.selectedTaskId
        ? `/admin/tools.html?taskId=${encodeURIComponent(state.selectedTaskId)}`
        : "/admin/tools.html";
    }

    function applyInitialQuery() {
      const params = new URLSearchParams(window.location.search);
      setIfPresent("status", params.get("status"));
      setIfPresent("taskType", params.get("taskType"));
      setIfPresent("taskNo", params.get("taskNo"));
      setIfPresent("filterUserId", params.get("userId"));
      setIfPresent("traceId", params.get("traceId"));
      setIfPresent("reportId", params.get("reportId"));
      state.pageNum = positiveInt(params.get("pageNum"), 1);
      state.pageSize = positiveInt(params.get("pageSize"), 20);
      state.selectedTaskId = params.get("taskId") || "";
    }

    function positiveInt(value, fallback) {
      const parsed = Number.parseInt(value, 10);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
    }

    function setIfPresent(id, value) {
      if (value != null && $(id)) {
        $(id).value = value;
      }
    }

    function metric(label, value) {
      return `
        <div class="metric">
          <span>${escapeHtml(label)}</span>
          <strong>${number(value)}</strong>
        </div>
      `;
    }

    function setStatus(message) {
      $("statusLine").textContent = message;
    }

    async function withBusy(button, busyText, action, restoreDisabled = true) {
      if (button.disabled) {
        return;
      }
      const originalDisabled = button.disabled;
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = busyText;
      try {
        return await action();
      } finally {
        if (restoreDisabled) {
          button.disabled = originalDisabled;
        }
        button.textContent = originalText;
      }
    }

    async function copyText(text, label) {
      const value = String(text || "").trim();
      if (!value || value === "请选择一条任务" || value === "加载中...") {
        setStatus(`${label} 没有可复制内容`);
        return;
      }
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(value);
        } else {
          fallbackCopy(value);
        }
        setStatus(`${label} 已复制`);
      } catch (error) {
        fallbackCopy(value);
        setStatus(`${label} 已复制`);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    function emptyRow(colspan, title, message) {
      return `
        <tr>
          <td colspan="${colspan}">
            <div class="empty-state">
              <strong>${escapeHtml(title)}</strong>
              <span>${escapeHtml(message)}</span>
              <div class="empty-actions">
                <button type="button" data-empty-reset>清空筛选</button>
                <button type="button" data-retry-list>刷新</button>
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    function errorRow(colspan, title, message) {
      return emptyRow(colspan, title, message || "请检查服务后重试。");
    }

    function number(value) {
      return Number(value || 0);
    }

    function formatTime(value) {
      return value ? String(value).replace("T", " ").slice(0, 19) : "";
    }

    function statusClass(value) {
      return String(value || "").toLowerCase();
    }

    function eventStatusClass(eventType) {
      return eventType === "TASK_FAILED" ? "failure" : "success";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value || "");
    }

    $("contextForm").addEventListener("submit", (event) => {
      event.preventDefault();
      refreshAll();
    });

    $("resetContext").addEventListener("click", resetContext);

    $("filterForm").addEventListener("submit", (event) => {
      event.preventDefault();
      state.pageNum = 1;
      withBusy($("taskFilterSubmit"), "查询中", loadTasks);
    });

    $("resetFilters").addEventListener("click", () => withBusy($("resetFilters"), "重置中", resetFilters));
    $("createForm").addEventListener("submit", (event) => {
      event.preventDefault();
      withBusy($("createTaskSubmit"), "创建中", () => createTask(event));
    });
    $("resetCreate").addEventListener("click", resetCreateForm);
    $("copyDetail").addEventListener("click", () => copyText($("detailBox").textContent, "任务详情"));
    $("retryTask").addEventListener("click", () => withBusy($("retryTask"), "重试中", retrySelectedTask));
    $("requeueStale").addEventListener("click", () => withBusy($("requeueStale"), "重排中", requeueStaleTasks));
    $("refreshEvents").addEventListener("click", () => withBusy($("refreshEvents"), "刷新中", loadEvents));
    $("clearDetail").addEventListener("click", () => {
      state.selectedTaskId = "";
      state.selectedReportId = "";
      state.selectedTraceId = "";
      $("detailBox").textContent = "请选择一条任务";
      updateContextLinks();
      syncUrl();
      markSelectedTask();
    });

    document.querySelector(".quick-actions").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-quick-filter]");
      if (button) {
        applyQuickFilter(button.dataset.quickFilter);
      }
    });

    $("prevPage").addEventListener("click", () => {
      if (state.pageNum > 1) {
        state.pageNum -= 1;
        withBusy($("prevPage"), "加载中", loadTasks, false);
      }
    });

    $("nextPage").addEventListener("click", () => {
      if (state.pageNum * state.pageSize < state.total) {
        state.pageNum += 1;
        withBusy($("nextPage"), "加载中", loadTasks, false);
      }
    });

    $("taskBody").addEventListener("click", (event) => {
      if (event.target.closest("button[data-empty-reset]")) {
        resetFilters();
        return;
      }
      if (event.target.closest("button[data-retry-list]")) {
        loadTasks();
        return;
      }
      const row = event.target.closest("tr[data-task-id]");
      if (row) {
        loadDetail(row.dataset.taskId);
      }
    });

    resetCreateForm();
    applyStoredSession();
    applyInitialQuery();
    updateContextLinks();
    refreshAll();
  </script>
</body>
</html>
