<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopOps 审计中心</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee6;
      --text: #1f2933;
      --muted: #667085;
      --green: #168a5b;
      --red: #c24132;
      --amber: #b7791f;
      --teal: #0f766e;
      --ink: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }

    button.primary {
      border-color: #111827;
      background: #111827;
      color: #ffffff;
    }

    button.icon {
      width: 36px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    input, select {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 9px;
      background: #ffffff;
      color: var(--ink);
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
    }

    .sidebar {
      background: #20242b;
      color: #f8fafc;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand { display: grid; gap: 3px; }
    .brand strong { font-size: 18px; font-weight: 700; }
    .brand span { color: #b8c0cc; font-size: 12px; }

    .nav { display: grid; gap: 6px; }

    .nav a {
      color: #cdd5df;
      text-decoration: none;
      border-radius: 6px;
      padding: 9px 10px;
    }

    .nav a.active {
      background: #343a44;
      color: #ffffff;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      min-width: 0;
      padding: 18px 24px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(360px, 680px);
      gap: 18px;
      align-items: end;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .context-session {
      grid-column: 1 / -1;
      min-height: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      padding: 16px 24px;
      display: grid;
      gap: 14px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric span { color: var(--muted); font-size: 12px; }

    .metric strong {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .risk-row {
      display: grid;
      grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
      gap: 10px;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title h2 {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .risk-bars { display: grid; gap: 9px; }

    .risk-bar {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) 42px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .track {
      height: 8px;
      border-radius: 999px;
      background: #edf0f3;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--teal);
      border-radius: inherit;
      min-width: 2px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .quick-actions span {
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      min-width: 0;
      padding: 0 24px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: start;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .timeline-column {
      min-width: 0;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9fafb;
      color: #475467;
      font-size: 12px;
      font-weight: 600;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fbfa; }

    .summary-cell {
      max-width: 260px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .empty-state {
      display: grid;
      gap: 8px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      white-space: normal;
    }

    .empty-state strong {
      color: var(--ink);
      font-size: 14px;
    }

    .empty-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #eef2f6;
      color: #344054;
    }

    .badge.low, .badge.success {
      background: #e7f6ef;
      color: var(--green);
    }

    .badge.medium {
      background: #fff6df;
      color: var(--amber);
    }

    .badge.high, .badge.failure, .badge.failed {
      background: #fdecea;
      color: var(--red);
    }

    .side {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 14px;
    }

    .detail-box, .export-box {
      max-height: 390px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      padding: 10px;
      color: #344054;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .link-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .link-row a {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--ink);
      background: var(--panel);
      text-decoration: none;
      font-size: 13px;
    }

    .summary-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .summary-item {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fbfcfd;
    }

    .summary-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .summary-item strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .events-list { display: grid; gap: 8px; }

    .event-line {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) 70px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid #eef1f4;
      padding-bottom: 8px;
      cursor: pointer;
    }

    .event-line:hover {
      color: var(--ink);
    }

    .event-line strong {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .status-line {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 8px 8px;
    }

    .pager-actions { display: flex; gap: 8px; }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar, .content, .risk-row { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
      .side { position: static; }
    }

    @media (max-width: 720px) {
      .topbar, .toolbar, .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .context-grid, .filters, .metrics {
        grid-template-columns: 1fr 1fr;
      }

      .filters button, .context-grid button { width: 100%; }

      .table-wrap {
        overflow: visible;
      }

      table {
        min-width: 0;
      }

      thead {
        display: none;
      }

      tbody {
        display: grid;
        gap: 8px;
      }

      tbody tr {
        display: grid;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      tbody td {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        white-space: normal;
      }

      tbody td::before {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      tbody td:nth-child(1)::before { content: "\65f6\95f4"; }
      tbody td:nth-child(2)::before { content: "\6765\6e90"; }
      tbody td:nth-child(3)::before { content: "\7c7b\578b"; }
      tbody td:nth-child(4)::before { content: "\72b6\6001"; }
      tbody td:nth-child(5)::before { content: "\98ce\9669"; }
      tbody td:nth-child(6)::before { content: "\7528\6237"; }
      tbody td:nth-child(7)::before { content: "\4efb\52a1"; }
      tbody td:nth-child(8)::before { content: "Trace"; }
      tbody td:nth-child(9)::before { content: "\6458\8981"; }

      .summary-cell {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>ShopOps Agent</strong>
        <span>管理控制台</span>
      </div>
      <nav class="nav" aria-label="管理导航">
        <a href="/admin/dashboard.html">总览</a>
        <a href="/admin/auth.html">认证</a>
        <a href="/admin/tasks.html">任务队列</a>
        <a class="active" href="/admin/audit.html">审计中心</a>
        <a href="/admin/approvals.html">审批中心</a>
        <a href="/admin/reports.html">报告</a>
        <a href="/admin/tools.html">工具日志</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>审计中心</h1>
          <div class="subtitle">认证、任务、工具调用统一时间线</div>
        </div>
        <form id="contextForm" class="context-grid">
          <label>租户
            <input id="tenantId" value="1" inputmode="numeric">
          </label>
          <label>店铺
            <input id="shopId" value="1" inputmode="numeric">
          </label>
          <label>用户
            <input id="userId" value="1" inputmode="numeric">
          </label>
          <label>Bearer
            <input id="token" placeholder="access token">
          </label>
          <button class="primary" type="submit" title="刷新">刷新</button>
          <button class="icon" id="clearToken" type="button" title="清空 Token" aria-label="清空 Token">×</button>
          <div class="context-session" id="sessionLine">请求头上下文</div>
        </form>
      </header>

      <section class="toolbar">
        <div class="metrics" id="metrics"></div>
        <div class="risk-row">
          <section class="panel">
            <div class="panel-title">
              <h2>风险分布</h2>
              <span class="status-line" id="riskTotal"></span>
            </div>
            <div class="risk-bars" id="riskBars"></div>
          </section>
          <section class="panel">
            <div class="panel-title">
              <h2>最近高风险</h2>
              <button id="refreshRisk" class="icon" title="刷新高风险" aria-label="刷新高风险">↻</button>
            </div>
            <div class="events-list" id="highRiskEvents"></div>
          </section>
        </div>
        <form id="filterForm" class="filters">
          <label>来源
            <select id="source">
              <option value="">全部</option>
              <option value="AUTH">认证</option>
              <option value="TASK">任务</option>
              <option value="TOOL">工具</option>
              <option value="APPROVAL">审批</option>
            </select>
          </label>
          <label>状态
            <select id="eventStatus">
              <option value="">全部</option>
              <option value="SUCCESS">成功</option>
              <option value="FAILURE">失败</option>
              <option value="FAILED">失败</option>
              <option value="CANCELED">已取消</option>
            </select>
          </label>
          <label>风险
            <select id="riskLevel">
              <option value="">全部</option>
              <option value="ELEVATED">中高风险</option>
              <option value="LOW">低</option>
              <option value="MEDIUM">中</option>
              <option value="HIGH">高</option>
            </select>
          </label>
          <label>任务 ID
            <input id="taskId" inputmode="numeric">
          </label>
          <label>Trace ID
            <input id="traceId">
          </label>
          <label>工具
            <input id="toolCode">
          </label>
          <button class="primary" type="submit">查询</button>
          <button id="resetFilters" type="button">重置</button>
        </form>
        <div class="quick-actions" aria-label="审计快捷筛选">
          <span>快捷筛选</span>
          <button type="button" data-quick-filter="failed">失败事件</button>
          <button type="button" data-quick-filter="high-risk">中高风险</button>
          <button type="button" data-quick-filter="approval">审批事件</button>
          <button type="button" data-quick-filter="tool">工具调用</button>
          <button type="button" data-quick-filter="clear">清空筛选</button>
        </div>
        <div class="status-line" id="statusLine"></div>
      </section>

      <section class="content">
        <div class="timeline-column">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>来源</th>
                  <th>类型</th>
                  <th>状态</th>
                  <th>风险</th>
                  <th>用户</th>
                  <th>任务</th>
                  <th>Trace</th>
                  <th>摘要</th>
                </tr>
              </thead>
              <tbody id="timelineBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pageInfo">第 1 页</span>
            <div class="pager-actions">
              <button id="prevPage" type="button">上一页</button>
              <button id="nextPage" type="button">下一页</button>
            </div>
          </div>
        </div>

        <aside class="side">
          <section class="panel">
            <div class="panel-title">
              <h2>事件详情</h2>
              <div class="button-row">
                <button id="copyDetail" type="button">复制</button>
                <button id="clearDetail" class="icon" type="button" title="清空详情" aria-label="清空详情">×</button>
              </div>
            </div>
            <div class="summary-box" id="eventSummary"></div>
            <pre class="detail-box" id="detailBox">请选择一条时间线事件</pre>
            <div class="link-row">
              <a id="openTask" href="/admin/tasks.html">打开任务</a>
              <a id="openReport" href="/admin/reports.html">打开报告</a>
              <a id="openApproval" href="/admin/approvals.html">审批中心</a>
              <a id="openToolLogs" href="/admin/tools.html">工具日志</a>
            </div>
          </section>
          <section class="panel">
            <div class="panel-title">
              <h2>CSV 下载</h2>
              <button id="exportBtn" class="primary" type="button">下载 CSV</button>
            </div>
            <pre class="export-box" id="exportBox">等待下载</pre>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const TOKEN_KEY = "shopops.auth.token";
    const USER_KEY = "shopops.auth.user";
    const state = { pageNum: 1, pageSize: 20, total: 0, selectedTaskId: "", selectedReportId: "", selectedTraceId: "", selectedToolCode: "", selectedApprovalId: "" };
    const $ = (id) => document.getElementById(id);

    const metricItems = [
      ["authEventTotal", "认证事件"],
      ["authFailureTotal", "认证失败"],
      ["taskEventTotal", "任务事件"],
      ["taskFailureTotal", "任务失败"],
      ["toolCallTotal", "工具调用"],
      ["toolCallFailed", "工具失败"]
    ];

    function headers() {
      const token = $("token").value.trim();
      const result = {
        "X-Tenant-Id": $("tenantId").value || "1",
        "X-Shop-Id": $("shopId").value || "1",
        "X-User-Id": $("userId").value || "1",
        "X-User-Roles": roleValue(authSession().user?.roles)
      };
      if (token) {
        result.Authorization = `Bearer ${token}`;
      }
      return result;
    }

    function filters() {
      const values = {
        source: $("source").value,
        eventStatus: $("eventStatus").value,
        riskLevel: $("riskLevel").value,
        taskId: $("taskId").value,
        traceId: $("traceId").value,
        toolCode: $("toolCode").value,
        pageNum: state.pageNum,
        pageSize: state.pageSize
      };
      const params = new URLSearchParams();
      Object.entries(values).forEach(([key, value]) => {
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          if (key === "riskLevel" && value === "ELEVATED") {
            params.set("elevatedRisk", "true");
          } else {
            params.set(key, value);
          }
        }
      });
      return params;
    }

    function syncUrl() {
      const query = filters().toString();
      window.history.replaceState(null, "", `${window.location.pathname}${query ? `?${query}` : ""}`);
    }

    async function api(path) {
      const response = await fetch(path, { headers: headers() });
      const body = await response.json();
      if (!response.ok || body.code !== 200) {
        throw new Error(body.message || `HTTP ${response.status}`);
      }
      return body.data;
    }

    async function refreshAll() {
      setStatus("加载中...");
      try {
        await Promise.all([loadOverview(), loadRisk(), loadTimeline()]);
        setStatus(`已刷新 ${new Date().toLocaleTimeString()}`);
      } catch (error) {
        setStatus(`加载失败：${error.message}`);
      }
    }

    async function loadOverview() {
      const data = await api("/api/admin/audit/overview");
      $("metrics").innerHTML = metricItems.map(([key, label]) => `
        <div class="metric">
          <span>${label}</span>
          <strong>${number(data[key])}</strong>
        </div>
      `).join("");
    }

    async function loadRisk() {
      const data = await api("/api/admin/audit/high-risk");
      const breakdown = data.riskBreakdown || {};
      const total = Math.max(1, Object.values(breakdown).reduce((sum, value) => sum + number(value), 0));
      $("riskTotal").textContent = `${number(data.elevatedRiskTotal)} 中高风险 / ${number(data.total)} 总数`;
      $("riskBars").innerHTML = ["HIGH", "MEDIUM", "LOW", "UNKNOWN"].map((level) => {
        const value = number(breakdown[level]);
        const width = Math.max(2, Math.round((value / total) * 100));
        return `
          <div class="risk-bar">
            <span>${level}</span>
            <div class="track"><div class="fill" style="width:${width}%"></div></div>
            <strong>${value}</strong>
          </div>
        `;
      }).join("");
      $("highRiskEvents").innerHTML = (data.recentElevatedRiskEvents || []).slice(0, 8).map((event) => `
        <div class="event-line" data-source="${escapeAttr(event.source)}" data-resource-id="${escapeAttr(event.resourceId)}" title="查看详情">
          <span>${escapeHtml(event.source || "")}</span>
          <strong>${escapeHtml(event.summary || event.eventType || "")}</strong>
          <span class="badge ${riskClass(event.riskLevel)}">${escapeHtml(event.riskLevel || "UNKNOWN")}</span>
        </div>
      `).join("") || `<div class="status-line">暂无高风险事件</div>`;
    }

    async function loadTimeline() {
      syncUrl();
      try {
        const data = await api(`/api/admin/audit/timeline?${filters().toString()}`);
        state.total = number(data.total);
        $("timelineBody").innerHTML = (data.list || []).map((event) => `
          <tr data-source="${escapeAttr(event.source)}" data-resource-id="${escapeAttr(event.resourceId)}">
            <td>${formatTime(event.createdAt)}</td>
            <td><span class="badge">${escapeHtml(event.source || "")}</span></td>
            <td>${escapeHtml(event.eventType || "")}</td>
            <td><span class="badge ${statusClass(event.eventStatus)}">${escapeHtml(event.eventStatus || "")}</span></td>
            <td><span class="badge ${riskClass(event.riskLevel)}">${escapeHtml(event.riskLevel || "UNKNOWN")}</span></td>
            <td>${escapeHtml(event.username || event.userId || "")}</td>
            <td>${escapeHtml(event.taskId || "")}</td>
            <td>${escapeHtml(event.traceId || "")}</td>
            <td class="summary-cell">${escapeHtml(event.summary || "")}</td>
          </tr>
        `).join("") || emptyRow(9, "暂无数据", "可以清空筛选或刷新审计时间线。");
        $("pageInfo").textContent = `Page ${data.pageNum || state.pageNum} · ${state.total} rows`;
        $("prevPage").disabled = state.pageNum <= 1;
        $("nextPage").disabled = state.pageNum * state.pageSize >= state.total;
      } catch (error) {
        state.total = 0;
        $("timelineBody").innerHTML = errorRow(9, "审计时间线加载失败", error.message);
        $("pageInfo").textContent = "审计时间线不可用";
        $("prevPage").disabled = true;
        $("nextPage").disabled = true;
        throw error;
      }
    }

    async function loadDetail(source, resourceId) {
      if (!source || !resourceId) {
        return;
      }
      $("eventSummary").innerHTML = "";
      $("detailBox").textContent = "加载中...";
      try {
        const data = await api(`/api/admin/audit/timeline/${encodeURIComponent(source)}/${encodeURIComponent(resourceId)}`);
        $("detailBox").textContent = JSON.stringify(data, null, 2);
        const event = data.event || {};
        state.selectedTaskId = event.taskId || data.context?.taskId || "";
        state.selectedReportId = data.context?.reportId || event.detail?.eventData?.reportId || "";
        state.selectedTraceId = event.traceId || data.context?.traceId || "";
        state.selectedToolCode = event.toolCode || "";
        state.selectedApprovalId = source === "APPROVAL" ? resourceId : "";
        $("eventSummary").innerHTML = summaryItems([
          ["来源", event.source || source],
          ["类型", event.eventType || ""],
          ["状态", event.eventStatus || ""],
          ["风险", event.riskLevel || "UNKNOWN"],
          ["任务", state.selectedTaskId || ""],
          ["报告", state.selectedReportId || ""],
          ["Trace", state.selectedTraceId || ""],
          ["工具调用", data.context?.toolCallCount || ""]
        ]);
        updateContextLinks();
      } catch (error) {
        $("eventSummary").innerHTML = "";
        $("detailBox").textContent = error.message;
      }
    }

    function applyQuickFilter(name) {
      if (name === "clear") {
        resetFilters();
      } else {
        $("filterForm").reset();
        if (name === "failed") {
          $("eventStatus").value = "FAILURE";
        } else if (name === "high-risk") {
          $("riskLevel").value = "ELEVATED";
        } else if (name === "approval") {
          $("source").value = "APPROVAL";
        } else if (name === "tool") {
          $("source").value = "TOOL";
        }
        state.pageNum = 1;
        loadTimeline();
      }
    }

    async function resetFilters() {
      $("filterForm").reset();
      state.pageNum = 1;
      await loadTimeline();
    }

    function applyInitialQuery() {
      const params = new URLSearchParams(window.location.search);
      setIfPresent("source", params.get("source"));
      setIfPresent("eventStatus", params.get("eventStatus"));
      setIfPresent("riskLevel", params.get("riskLevel"));
      setIfPresent("taskId", params.get("taskId"));
      setIfPresent("traceId", params.get("traceId"));
      setIfPresent("toolCode", params.get("toolCode"));
      state.pageNum = positiveInt(params.get("pageNum"), 1);
      state.pageSize = positiveInt(params.get("pageSize"), 20);
      if (params.get("elevatedRisk") === "true") {
        $("riskLevel").value = "ELEVATED";
      }
    }

    function positiveInt(value, fallback) {
      const parsed = Number.parseInt(value, 10);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
    }

    function setIfPresent(id, value) {
      if (value != null && $(id)) {
        $(id).value = value;
      }
    }

    function updateContextLinks() {
      $("openTask").href = state.selectedTaskId
        ? `/admin/tasks.html?taskId=${encodeURIComponent(state.selectedTaskId)}`
        : "/admin/tasks.html";
      $("openReport").href = state.selectedReportId
        ? `/admin/reports.html?reportId=${encodeURIComponent(state.selectedReportId)}`
        : (state.selectedTaskId ? `/admin/reports.html?taskId=${encodeURIComponent(state.selectedTaskId)}` : "/admin/reports.html");
      $("openApproval").href = state.selectedApprovalId
        ? `/admin/approvals.html?approvalId=${encodeURIComponent(state.selectedApprovalId)}`
        : "/admin/approvals.html";
      $("openToolLogs").href = state.selectedTaskId
        ? `/admin/tools.html?taskId=${encodeURIComponent(state.selectedTaskId)}`
        : (state.selectedToolCode ? `/admin/tools.html?toolCode=${encodeURIComponent(state.selectedToolCode)}` : "/admin/tools.html");
    }

    function summaryItems(items) {
      return items.map(([label, value]) => `
        <div class="summary-item">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value || "-")}</strong>
        </div>
      `).join("");
    }

    function setStatus(message) {
      $("statusLine").textContent = message;
    }

    async function withBusy(button, busyText, action, restoreDisabled = true) {
      if (button.disabled) {
        return;
      }
      const originalDisabled = button.disabled;
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = busyText;
      try {
        return await action();
      } finally {
        if (restoreDisabled) {
          button.disabled = originalDisabled;
        }
        button.textContent = originalText;
      }
    }

    async function copyText(text, label) {
      const value = String(text || "").trim();
      if (!value || value === "选择一条时间线事件" || value === "加载中...") {
        setStatus(`没有可复制的${label}`);
        return;
      }
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(value);
        } else {
          fallbackCopy(value);
        }
        setStatus(`${label}已复制`);
      } catch (error) {
        fallbackCopy(value);
        setStatus(`${label}已复制`);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    function applyStoredSession() {
      const session = authSession();
      if (session.user) {
        $("tenantId").value = session.user.tenantId || $("tenantId").value || "1";
        $("shopId").value = session.user.shopId || $("shopId").value || "1";
        $("userId").value = session.user.userId || $("userId").value || "1";
      }
      if (session.token && !$("token").value.trim()) {
        $("token").value = session.token;
      }
      renderSessionLine();
    }

    function renderSessionLine() {
      const session = authSession();
      const token = $("token").value.trim();
      $("sessionLine").textContent = token
        ? `已加载 Bearer 会话${session.user?.username ? `：${session.user.username}` : ""}`
        : "请求头上下文";
    }

    function authSession() {
      let user = null;
      try {
        user = JSON.parse(localStorage.getItem(USER_KEY) || "null");
      } catch (error) {
        user = null;
      }
      return { token: localStorage.getItem(TOKEN_KEY) || "", user };
    }

    function roleValue(roles) {
      return Array.isArray(roles) ? roles.join(",") : (roles || "ADMIN");
    }

    function emptyRow(colspan, title, message) {
      return `
        <tr>
          <td colspan="${colspan}">
            <div class="empty-state">
              <strong>${escapeHtml(title)}</strong>
              <span>${escapeHtml(message)}</span>
              <div class="empty-actions">
                <button type="button" data-empty-reset>清空筛选</button>
                <button type="button" data-retry-list>刷新</button>
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    function errorRow(colspan, title, message) {
      return emptyRow(colspan, title, message || "请检查服务状态后重试。");
    }

    async function loadExport() {
      $("exportBox").textContent = "正在生成 CSV...";
      try {
        const response = await fetch(`/api/admin/audit/export.csv?${filters().toString()}`, { headers: headers() });
        if (!response.ok) {
          throw new Error(`下载失败：HTTP ${response.status}`);
        }
        const blob = await response.blob();
        const fileName = exportFileName(response.headers.get("Content-Disposition"));
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        $("exportBox").textContent = `已下载 ${fileName}\n文件大小 ${blob.size} bytes`;
      } catch (error) {
        $("exportBox").textContent = error.message;
      }
    }

    function exportFileName(contentDisposition) {
      const fallback = `shopops-audit-${new Date().toISOString().slice(0, 10)}.csv`;
      if (!contentDisposition) {
        return fallback;
      }
      const match = contentDisposition.match(/filename="?([^";]+)"?/i);
      return match ? match[1] : fallback;
    }

    function number(value) {
      return Number(value || 0);
    }

    function formatTime(value) {
      return value ? String(value).replace("T", " ").slice(0, 19) : "";
    }

    function statusClass(value) {
      return String(value || "").toLowerCase();
    }

    function riskClass(value) {
      return String(value || "unknown").toLowerCase();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value || "");
    }

    $("contextForm").addEventListener("submit", (event) => {
      event.preventDefault();
      state.pageNum = 1;
      refreshAll();
    });

    $("filterForm").addEventListener("submit", (event) => {
      event.preventDefault();
      state.pageNum = 1;
      withBusy(document.querySelector("#filterForm button.primary"), "查询中", loadTimeline);
    });

    $("resetFilters").addEventListener("click", () => withBusy($("resetFilters"), "重置中", resetFilters));

    $("refreshRisk").addEventListener("click", () => withBusy($("refreshRisk"), "刷新中", loadRisk));
    $("exportBtn").addEventListener("click", () => withBusy($("exportBtn"), "下载中", loadExport));
    document.querySelector(".quick-actions").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-quick-filter]");
      if (button) {
        applyQuickFilter(button.dataset.quickFilter);
      }
    });
    $("highRiskEvents").addEventListener("click", (event) => {
      const item = event.target.closest(".event-line[data-source]");
      if (item) {
        loadDetail(item.dataset.source, item.dataset.resourceId);
      }
    });
    $("clearToken").addEventListener("click", () => {
      $("token").value = "";
      renderSessionLine();
      refreshAll();
    });
    $("copyDetail").addEventListener("click", () => copyText($("detailBox").textContent, "审计详情"));
    $("clearDetail").addEventListener("click", () => {
      $("eventSummary").innerHTML = "";
      $("detailBox").textContent = "选择一条时间线事件";
      state.selectedTaskId = "";
      state.selectedReportId = "";
      state.selectedTraceId = "";
      state.selectedToolCode = "";
      state.selectedApprovalId = "";
      updateContextLinks();
    });
    $("prevPage").addEventListener("click", () => {
      if (state.pageNum > 1) {
        state.pageNum -= 1;
        withBusy($("prevPage"), "加载中", loadTimeline, false);
      }
    });
    $("nextPage").addEventListener("click", () => {
      if (state.pageNum * state.pageSize < state.total) {
        state.pageNum += 1;
        withBusy($("nextPage"), "加载中", loadTimeline, false);
      }
    });
    $("timelineBody").addEventListener("click", (event) => {
      if (event.target.closest("button[data-empty-reset]")) {
        resetFilters();
        return;
      }
      if (event.target.closest("button[data-retry-list]")) {
        loadTimeline();
        return;
      }
      const row = event.target.closest("tr[data-source]");
      if (row) {
        loadDetail(row.dataset.source, row.dataset.resourceId);
      }
    });

    applyStoredSession();
    applyInitialQuery();
    updateContextLinks();
    refreshAll();
  </script>
</body>
</html>
