<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopOps 审批中心</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee6;
      --text: #1f2933;
      --muted: #667085;
      --ink: #111827;
      --green: #168a5b;
      --red: #c24132;
      --amber: #b7791f;
      --teal: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }

    button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #ffffff;
    }

    button.danger {
      border-color: var(--red);
      color: var(--red);
      background: #fff8f7;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
    }

    input, select {
      min-height: 34px;
      padding: 6px 9px;
    }

    textarea {
      min-height: 82px;
      padding: 9px;
      resize: vertical;
      line-height: 1.45;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
    }

    .sidebar {
      background: #20242b;
      color: #f8fafc;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand { display: grid; gap: 3px; }
    .brand strong { font-size: 18px; font-weight: 700; }
    .brand span { color: #b8c0cc; font-size: 12px; }

    .nav { display: grid; gap: 6px; }

    .nav a {
      color: #cdd5df;
      text-decoration: none;
      border-radius: 6px;
      padding: 9px 10px;
    }

    .nav a.active {
      background: #343a44;
      color: #ffffff;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      min-width: 0;
      padding: 18px 24px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(360px, 680px);
      gap: 18px;
      align-items: end;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .context-session {
      grid-column: 1 / -1;
      min-height: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      padding: 16px 24px;
      display: grid;
      gap: 14px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric span { color: var(--muted); font-size: 12px; }

    .metric strong {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .quick-actions span {
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      min-width: 0;
      padding: 0 24px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 14px;
      align-items: start;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 1060px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9fafb;
      color: #475467;
      font-size: 12px;
      font-weight: 600;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fbfa; }
    tbody tr.selected { background: #eef8f6; }

    .wrap-cell {
      max-width: 260px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .empty-state {
      display: grid;
      gap: 8px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      white-space: normal;
    }

    .empty-state strong {
      color: var(--ink);
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #eef2f6;
      color: #344054;
      text-align: center;
    }

    .badge.pending, .badge.medium {
      background: #fff6df;
      color: var(--amber);
    }

    .badge.approved, .badge.success, .badge.low {
      background: #e7f6ef;
      color: var(--green);
    }

    .badge.rejected, .badge.failure, .badge.high {
      background: #fdecea;
      color: var(--red);
    }

    .badge.withdrawn, .badge.canceled {
      background: #eef2f6;
      color: #475467;
    }

    .badge.expired {
      background: #fef3c7;
      color: #92400e;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 8px 8px;
    }

    .pager-actions, .button-row, .link-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .side {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 14px;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title h2 {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
    }

    .summary-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .summary-item {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fbfcfd;
    }

    .summary-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .summary-item strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .detail-box {
      max-height: 360px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      padding: 10px;
      color: #344054;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .link-row { margin-top: 10px; }

    .link-row a {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--ink);
      background: var(--panel);
      text-decoration: none;
      font-size: 13px;
    }

    .status-line {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar, .content { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      .side { position: static; }
    }

    @media (max-width: 720px) {
      .topbar, .toolbar, .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .context-grid, .filters, .metrics {
        grid-template-columns: 1fr 1fr;
      }

      .filters button, .context-grid button { width: 100%; }

      .table-wrap { overflow: visible; }
      table { min-width: 0; }
      thead { display: none; }
      tbody { display: grid; gap: 8px; }

      tbody tr {
        display: grid;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      tbody td {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        white-space: normal;
      }

      tbody td::before {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      tbody td:nth-child(1)::before { content: "选择"; }
      tbody td:nth-child(2)::before { content: "审批单"; }
      tbody td:nth-child(3)::before { content: "状态"; }
      tbody td:nth-child(4)::before { content: "风险"; }
      tbody td:nth-child(5)::before { content: "工具"; }
      tbody td:nth-child(6)::before { content: "申请人"; }
      tbody td:nth-child(7)::before { content: "审批人"; }
      tbody td:nth-child(8)::before { content: "创建时间"; }
      tbody td:nth-child(9)::before { content: "标题"; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>ShopOps Agent</strong>
        <span>管理控制台</span>
      </div>
      <nav class="nav" aria-label="后台导航">
        <a href="/admin/dashboard.html">总览</a>
        <a href="/admin/auth.html">认证</a>
        <a href="/admin/tasks.html">任务队列</a>
        <a class="active" href="/admin/approvals.html">审批中心</a>
        <a href="/admin/audit.html">审计中心</a>
        <a href="/admin/reports.html">报告</a>
        <a href="/admin/tools.html">工具日志</a>
        <a href="/admin/prompts.html">提示词模板</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>审批中心</h1>
          <div class="subtitle">处理高风险工具调用与人工确认事项</div>
        </div>
        <form id="contextForm" class="context-grid">
          <label>租户
            <input id="tenantId" value="1" inputmode="numeric">
          </label>
          <label>店铺
            <input id="shopId" value="1" inputmode="numeric">
          </label>
          <label>用户
            <input id="userId" value="1" inputmode="numeric">
          </label>
          <label>角色
            <input id="roles" value="ADMIN">
          </label>
          <button class="primary" type="submit">刷新</button>
          <button id="resetContext" type="button">重置</button>
          <div class="context-session" id="sessionLine">请求头上下文</div>
        </form>
      </header>

      <section class="toolbar">
        <div class="metrics" id="metrics"></div>
        <form id="filterForm" class="filters">
          <label>状态
            <select id="status">
              <option value="">全部</option>
              <option value="PENDING">待审批</option>
              <option value="APPROVED">已通过</option>
              <option value="REJECTED">已驳回</option>
              <option value="WITHDRAWN">已撤回</option>
              <option value="EXPIRED">已超时</option>
            </select>
          </label>
          <label>风险
            <select id="riskLevel">
              <option value="">全部</option>
              <option value="HIGH">高</option>
              <option value="MEDIUM">中</option>
              <option value="LOW">低</option>
            </select>
          </label>
          <label>工具编码
            <input id="toolCode" placeholder="order.refund_execute">
          </label>
          <label>任务 ID
            <input id="taskId" inputmode="numeric">
          </label>
          <label>Trace ID
            <input id="traceId">
          </label>
          <label>审批单号
            <input id="approvalNo">
          </label>
          <label>审批 ID
            <input id="approvalId" inputmode="numeric">
          </label>
          <button class="primary" type="submit">查询</button>
          <button id="resetFilters" type="button">重置</button>
        </form>
        <div class="quick-actions" aria-label="审批快捷筛选">
          <span>快捷筛选</span>
          <button type="button" data-quick-filter="pending">待审批</button>
          <button type="button" data-quick-filter="high">高风险</button>
          <button type="button" data-quick-filter="refund">退款工具</button>
          <button type="button" data-quick-filter="clear">清空筛选</button>
          <button id="batchApproveBtn" class="primary" type="button">批量通过</button>
          <button id="batchRejectBtn" class="danger" type="button">批量驳回</button>
          <button id="expireStaleBtn" type="button">关闭超时</button>
        </div>
        <div class="status-line" id="statusLine"></div>
      </section>

      <section class="content">
        <div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><input id="selectAll" type="checkbox" aria-label="选择当前页"></th>
                  <th>审批单</th>
                  <th>状态</th>
                  <th>风险</th>
                  <th>工具</th>
                  <th>申请人</th>
                  <th>审批人</th>
                  <th>创建时间</th>
                  <th>标题</th>
                </tr>
              </thead>
              <tbody id="approvalBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pageInfo">第 1 页</span>
            <div class="pager-actions">
              <button id="prevPage" type="button">上一页</button>
              <button id="nextPage" type="button">下一页</button>
            </div>
          </div>
        </div>

        <aside class="side">
          <section class="panel">
            <div class="panel-title">
              <h2>审批详情</h2>
              <div class="button-row">
                <button id="copyDetail" type="button">复制</button>
                <button id="clearDetail" type="button">清空</button>
              </div>
            </div>
            <div class="summary-box" id="approvalSummary"></div>
            <pre class="detail-box" id="detailBox">请选择一条审批单</pre>
            <div class="link-row">
              <a id="openAudit" href="/admin/audit.html?source=APPROVAL">打开审计</a>
              <a id="openToolLogs" href="/admin/tools.html">工具日志</a>
              <a id="openTask" href="/admin/tasks.html">任务队列</a>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h2>处理意见</h2>
            </div>
            <label>备注
              <textarea id="decisionComment" placeholder="填写审批备注"></textarea>
            </label>
            <label>确认语
              <input id="confirmText" placeholder="高风险通过需输入：确认通过">
            </label>
            <div class="button-row" style="margin-top: 10px;">
              <button id="approveBtn" class="primary" type="button">通过</button>
              <button id="rejectBtn" class="danger" type="button">驳回</button>
              <button id="withdrawBtn" type="button">撤回</button>
            </div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const TOKEN_KEY = "shopops.auth.token";
    const USER_KEY = "shopops.auth.user";
    const state = { pageNum: 1, pageSize: 20, total: 0, list: [], selected: null, selectedIds: new Set() };
    const $ = (id) => document.getElementById(id);

    function headers() {
      const result = {
        "X-Tenant-Id": $("tenantId").value || "1",
        "X-Shop-Id": $("shopId").value || "1",
        "X-User-Id": $("userId").value || "1",
        "X-User-Roles": $("roles").value || "ADMIN"
      };
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) {
        result.Authorization = `Bearer ${token}`;
      }
      return result;
    }

    function apiHeaders() {
      return { ...headers(), "Content-Type": "application/json" };
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { ...headers(), ...(options.headers || {}) }
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.code !== 200) {
        throw new Error(payload.message || `HTTP ${response.status}`);
      }
      return payload.data;
    }

    function authSession() {
      try {
        return { user: JSON.parse(localStorage.getItem(USER_KEY) || "null") };
      } catch (error) {
        return { user: null };
      }
    }

    function applyStoredSession() {
      const session = authSession();
      if (session.user) {
        $("tenantId").value = session.user.tenantId || $("tenantId").value;
        $("shopId").value = session.user.shopId || $("shopId").value;
        $("userId").value = session.user.userId || $("userId").value;
        $("roles").value = Array.isArray(session.user.roles) ? session.user.roles.join(",") : ($("roles").value || "ADMIN");
        $("sessionLine").textContent = `当前会话：${session.user.username || session.user.userId || "已登录"}`;
      }
    }

    function filters() {
      const values = {
        status: $("status").value,
        riskLevel: $("riskLevel").value,
        toolCode: $("toolCode").value,
        taskId: $("taskId").value,
        traceId: $("traceId").value,
        approvalNo: $("approvalNo").value,
        approvalId: $("approvalId").value,
        pageNum: state.pageNum,
        pageSize: state.pageSize
      };
      const params = new URLSearchParams();
      Object.entries(values).forEach(([key, value]) => {
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          params.set(key, value);
        }
      });
      return params;
    }

    function setStatus(message) {
      $("statusLine").textContent = message || "";
    }

    function number(value) {
      return Number(value || 0).toLocaleString("zh-CN");
    }

    function text(value, fallback = "-") {
      return value === undefined || value === null || value === "" ? fallback : String(value);
    }

    function time(value) {
      if (!value) {
        return "-";
      }
      return String(value).replace("T", " ").slice(0, 19);
    }

    function escapeHtml(value) {
      return text(value, "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function statusLabel(value) {
      return { PENDING: "待审批", APPROVED: "已通过", REJECTED: "已驳回", WITHDRAWN: "已撤回", EXPIRED: "已超时" }[value] || text(value);
    }

    function riskLabel(value) {
      return { HIGH: "高", MEDIUM: "中", LOW: "低" }[String(value || "").toUpperCase()] || text(value);
    }

    function badge(value, label = value) {
      return `<span class="badge ${String(value || "").toLowerCase()}">${escapeHtml(label)}</span>`;
    }

    function emptyRow(message, hint) {
      return `<tr><td colspan="9"><div class="empty-state"><strong>${escapeHtml(message)}</strong><span>${escapeHtml(hint)}</span></div></td></tr>`;
    }

    function errorRow(message, detail) {
      return `<tr><td colspan="9"><div class="empty-state"><strong>${escapeHtml(message)}</strong><span>${escapeHtml(detail)}</span></div></td></tr>`;
    }

    function renderMetrics() {
      const counts = state.list.reduce((acc, item) => {
        acc.total += 1;
        acc.pending += item.status === "PENDING" ? 1 : 0;
        acc.approved += item.status === "APPROVED" ? 1 : 0;
        acc.rejected += item.status === "REJECTED" ? 1 : 0;
        acc.withdrawn += item.status === "WITHDRAWN" ? 1 : 0;
        acc.expired += item.status === "EXPIRED" ? 1 : 0;
        return acc;
      }, { total: 0, pending: 0, approved: 0, rejected: 0, withdrawn: 0, expired: 0 });
      const items = [
        ["当前页", counts.total],
        ["待审批", counts.pending],
        ["已通过", counts.approved],
        ["已驳回", counts.rejected],
        ["已撤回", counts.withdrawn],
        ["已超时", counts.expired]
      ];
      $("metrics").innerHTML = items.map(([label, value]) => `
        <div class="metric">
          <span>${label}</span>
          <strong>${number(value)}</strong>
        </div>
      `).join("");
    }

    function renderList() {
      $("approvalBody").innerHTML = state.list.map((item) => `
        <tr data-id="${item.approvalId}" class="${state.selected?.approvalId === item.approvalId ? "selected" : ""}">
          <td><input class="row-select" type="checkbox" data-select-id="${item.approvalId}" ${item.status !== "PENDING" ? "disabled" : ""} ${state.selectedIds.has(item.approvalId) ? "checked" : ""} aria-label="选择审批单 ${escapeHtml(item.approvalNo || item.approvalId)}"></td>
          <td>${escapeHtml(item.approvalNo || item.approvalId)}</td>
          <td>${badge(item.status, statusLabel(item.status))}</td>
          <td>${badge(item.riskLevel, riskLabel(item.riskLevel))}</td>
          <td>${escapeHtml(item.toolCode)}</td>
          <td>${escapeHtml(item.requesterName || item.requesterId)}</td>
          <td>${escapeHtml(item.approverName || item.approverId || "-")}</td>
          <td>${escapeHtml(time(item.createdAt))}</td>
          <td class="wrap-cell">${escapeHtml(item.title)}</td>
        </tr>
      `).join("") || emptyRow("暂无审批单", "可以清空筛选或触发一次高风险工具调用。");
      $("approvalBody").querySelectorAll("tr[data-id]").forEach((row) => {
        row.addEventListener("click", (event) => {
          if (event.target.matches("input[type='checkbox']")) {
            return;
          }
          loadDetail(row.dataset.id);
        });
      });
      $("approvalBody").querySelectorAll("[data-select-id]").forEach((checkbox) => {
        checkbox.addEventListener("click", (event) => event.stopPropagation());
        checkbox.addEventListener("change", () => {
          const id = Number(checkbox.dataset.selectId);
          if (checkbox.checked) {
            state.selectedIds.add(id);
          } else {
            state.selectedIds.delete(id);
          }
          updateBatchButtons();
        });
      });
      updateSelectAll();
      updateBatchButtons();
    }

    function renderPager() {
      const start = state.total === 0 ? 0 : ((state.pageNum - 1) * state.pageSize) + 1;
      const end = Math.min(state.total, state.pageNum * state.pageSize);
      $("pageInfo").textContent = `第 ${state.pageNum} 页，${start}-${end} / ${state.total}`;
      $("prevPage").disabled = state.pageNum <= 1;
      $("nextPage").disabled = state.pageNum * state.pageSize >= state.total;
    }

    function renderDetail(item) {
      state.selected = item;
      renderList();
      $("approvalSummary").innerHTML = [
        ["审批单", item.approvalNo || item.approvalId],
        ["状态", statusLabel(item.status)],
        ["风险", riskLabel(item.riskLevel)],
        ["工具", item.toolCode],
        ["申请人", item.requesterName || item.requesterId],
        ["审批人", item.approverName || item.approverId || "-"]
      ].map(([label, value]) => `
        <div class="summary-item">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
        </div>
      `).join("");
      $("detailBox").textContent = JSON.stringify(item, null, 2);
      $("approveBtn").disabled = item.status !== "PENDING";
      $("rejectBtn").disabled = item.status !== "PENDING";
      $("withdrawBtn").disabled = item.status !== "PENDING";
      $("openAudit").href = `/admin/audit.html?source=APPROVAL&resourceId=${encodeURIComponent(item.approvalId)}`;
      $("openToolLogs").href = item.toolCode
        ? `/admin/tools.html?toolCode=${encodeURIComponent(item.toolCode)}`
        : "/admin/tools.html";
      $("openTask").href = item.taskId
        ? `/admin/tasks.html?taskId=${encodeURIComponent(item.taskId)}`
        : "/admin/tasks.html";
    }

    async function loadList() {
      setStatus("正在加载审批单");
      try {
        const data = await api(`/api/admin/approvals?${filters().toString()}`);
        state.total = Number(data.total || 0);
        state.list = data.list || [];
        state.selectedIds.clear();
        renderMetrics();
        renderList();
        renderPager();
        if ($("approvalId").value && state.list.length > 0) {
          await loadDetail($("approvalId").value);
        }
        setStatus("审批单已刷新");
      } catch (error) {
        $("approvalBody").innerHTML = errorRow("审批单加载失败", error.message);
        setStatus("审批中心不可用");
      }
    }

    async function loadDetail(approvalId) {
      setStatus("正在加载审批详情");
      try {
        const item = await api(`/api/admin/approvals/${encodeURIComponent(approvalId)}`);
        renderDetail(item);
        setStatus("审批详情已加载");
      } catch (error) {
        setStatus(`审批详情加载失败：${error.message}`);
      }
    }

    async function decide(action) {
      if (!state.selected) {
        setStatus("请先选择一条审批单");
        return;
      }
      setStatus(actionStatusText(action, "正在通过审批", "正在驳回审批", "正在撤回审批"));
      try {
        const item = await api(`/api/admin/approvals/${encodeURIComponent(state.selected.approvalId)}/${action}`, {
          method: "POST",
          headers: apiHeaders(),
          body: JSON.stringify({
            comment: $("decisionComment").value.trim(),
            confirmText: $("confirmText").value.trim()
          })
        });
        renderDetail(item);
        await loadList();
        setStatus(actionStatusText(action, "审批已通过", "审批已驳回", "审批已撤回"));
      } catch (error) {
        setStatus(`审批处理失败：${error.message}`);
      }
    }

    async function batchDecide(action) {
      const approvalIds = Array.from(state.selectedIds);
      if (approvalIds.length === 0) {
        setStatus("请先勾选待处理审批单");
        return;
      }
      const label = action === "approve" ? "批量通过" : "批量驳回";
      setStatus(`正在${label}`);
      try {
        const result = await api(`/api/admin/approvals/batch/${action}`, {
          method: "POST",
          headers: apiHeaders(),
          body: JSON.stringify({
            approvalIds,
            comment: $("decisionComment").value.trim(),
            confirmText: $("confirmText").value.trim()
          })
        });
        state.selectedIds.clear();
        await loadList();
        setStatus(`${label}完成：成功 ${result.successCount}，失败 ${result.failedCount}`);
      } catch (error) {
        setStatus(`${label}失败：${error.message}`);
      }
    }

    async function expireStale() {
      setStatus("正在关闭超时审批单");
      try {
        const result = await api("/api/admin/approvals/expire-stale?timeoutMinutes=60&limit=50", {
          method: "POST",
          headers: apiHeaders()
        });
        state.selectedIds.clear();
        await loadList();
        setStatus(`超时关闭完成：成功 ${result.successCount}，失败 ${result.failedCount}`);
      } catch (error) {
        setStatus(`超时关闭失败：${error.message}`);
      }
    }

    function actionStatusText(action, approveText, rejectText, withdrawText) {
      if (action === "approve") {
        return approveText;
      }
      if (action === "reject") {
        return rejectText;
      }
      return withdrawText;
    }

    function applyInitialQuery() {
      const params = new URLSearchParams(window.location.search);
      ["status", "riskLevel", "toolCode", "taskId", "traceId", "approvalNo", "approvalId"].forEach((key) => {
        if (params.has(key)) {
          $(key).value = params.get(key);
        }
      });
      state.pageNum = positiveInt(params.get("pageNum"), 1);
      state.pageSize = positiveInt(params.get("pageSize"), 20);
    }

    function syncUrl() {
      const params = filters();
      window.history.replaceState(null, "", `${window.location.pathname}?${params.toString()}`);
    }

    function positiveInt(value, fallback) {
      const parsed = Number.parseInt(value, 10);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
    }

    function resetFilters() {
      clearFilterValues();
      state.pageNum = 1;
      syncUrl();
      loadList();
    }

    function clearFilterValues() {
      ["status", "riskLevel", "toolCode", "taskId", "traceId", "approvalNo", "approvalId"].forEach((id) => {
        $(id).value = "";
      });
    }

    async function copyText(value, label) {
      if (!value || value === "请选择一条审批单") {
        setStatus(`没有可复制的${label}`);
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
        setStatus(`${label}已复制`);
      } catch (error) {
        fallbackCopy(value);
        setStatus(`${label}已复制`);
      }
    }

    function fallbackCopy(value) {
      const area = document.createElement("textarea");
      area.value = value;
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    $("contextForm").addEventListener("submit", (event) => {
      event.preventDefault();
      loadList();
    });

    $("resetContext").addEventListener("click", () => {
      $("tenantId").value = "1";
      $("shopId").value = "1";
      $("userId").value = "1";
      $("roles").value = "ADMIN";
      $("sessionLine").textContent = "请求头上下文";
      loadList();
    });

    $("filterForm").addEventListener("submit", (event) => {
      event.preventDefault();
      state.pageNum = 1;
      syncUrl();
      loadList();
    });

    $("resetFilters").addEventListener("click", resetFilters);
    $("prevPage").addEventListener("click", () => {
      if (state.pageNum > 1) {
        state.pageNum -= 1;
        syncUrl();
        loadList();
      }
    });
    $("nextPage").addEventListener("click", () => {
      if (state.pageNum * state.pageSize < state.total) {
        state.pageNum += 1;
        syncUrl();
        loadList();
      }
    });

      document.querySelectorAll("[data-quick-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        const type = button.dataset.quickFilter;
        clearFilterValues();
        if (type === "pending") {
          $("status").value = "PENDING";
        } else if (type === "high") {
          $("riskLevel").value = "HIGH";
        } else if (type === "refund") {
          $("toolCode").value = "order.refund_execute";
        }
        state.pageNum = 1;
        syncUrl();
        loadList();
      });
    });

    function updateBatchButtons() {
      const hasSelection = state.selectedIds.size > 0;
      $("batchApproveBtn").disabled = !hasSelection;
      $("batchRejectBtn").disabled = !hasSelection;
    }

    function updateSelectAll() {
      const pendingIds = state.list
        .filter((item) => item.status === "PENDING")
        .map((item) => item.approvalId);
      $("selectAll").checked = pendingIds.length > 0 && pendingIds.every((id) => state.selectedIds.has(id));
      $("selectAll").disabled = pendingIds.length === 0;
    }

    $("copyDetail").addEventListener("click", () => copyText($("detailBox").textContent, "审批详情"));
    $("clearDetail").addEventListener("click", () => {
      state.selected = null;
      $("approvalSummary").innerHTML = "";
      $("detailBox").textContent = "请选择一条审批单";
      $("decisionComment").value = "";
      $("approveBtn").disabled = true;
      $("rejectBtn").disabled = true;
      $("withdrawBtn").disabled = true;
      renderList();
    });
    $("approveBtn").addEventListener("click", () => decide("approve"));
    $("rejectBtn").addEventListener("click", () => decide("reject"));
    $("withdrawBtn").addEventListener("click", () => decide("withdraw"));
    $("batchApproveBtn").addEventListener("click", () => batchDecide("approve"));
    $("batchRejectBtn").addEventListener("click", () => batchDecide("reject"));
    $("expireStaleBtn").addEventListener("click", expireStale);
    $("selectAll").addEventListener("change", () => {
      state.selectedIds.clear();
      if ($("selectAll").checked) {
        state.list
          .filter((item) => item.status === "PENDING")
          .forEach((item) => state.selectedIds.add(item.approvalId));
      }
      renderList();
    });

    applyStoredSession();
    applyInitialQuery();
    $("approveBtn").disabled = true;
    $("rejectBtn").disabled = true;
    $("withdrawBtn").disabled = true;
    updateBatchButtons();
    loadList();
  </script>
</body>
</html>
