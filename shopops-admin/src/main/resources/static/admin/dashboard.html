<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopOps Admin Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee6;
      --text: #1f2933;
      --muted: #667085;
      --ink: #111827;
      --green: #168a5b;
      --red: #c24132;
      --amber: #b7791f;
      --teal: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }

    button.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #ffffff;
    }

    input {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 9px;
      background: #ffffff;
      color: var(--ink);
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
    }

    .sidebar {
      background: #20242b;
      color: #f8fafc;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand { display: grid; gap: 3px; }
    .brand strong { font-size: 18px; font-weight: 700; }
    .brand span { color: #b8c0cc; font-size: 12px; }

    .nav { display: grid; gap: 6px; }

    .nav a {
      color: #cdd5df;
      text-decoration: none;
      border-radius: 6px;
      padding: 9px 10px;
    }

    .nav a.active {
      background: #343a44;
      color: #ffffff;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      min-width: 0;
      padding: 18px 24px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(360px, 680px);
      gap: 18px;
      align-items: end;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto auto;
      gap: 8px;
      align-items: end;
    }

    .content {
      min-width: 0;
      padding: 18px 24px 24px;
      display: grid;
      gap: 14px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title h2 {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
    }

    .health-grid, .risk-bars {
      display: grid;
      gap: 9px;
    }

    .health-row, .risk-bar, .event-line {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) 74px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid #eef1f4;
      padding-bottom: 8px;
    }

    .health-row:last-child, .risk-bar:last-child, .event-line:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .event-line strong {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .track {
      height: 8px;
      border-radius: 999px;
      background: #edf0f3;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      min-width: 2px;
      border-radius: inherit;
      background: var(--teal);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #eef2f6;
      color: #344054;
      text-align: center;
    }

    .badge.up, .badge.success, .badge.low {
      background: #e7f6ef;
      color: var(--green);
    }

    .badge.down, .badge.failed, .badge.failure, .badge.high {
      background: #fdecea;
      color: var(--red);
    }

    .badge.medium {
      background: #fff6df;
      color: var(--amber);
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .action-row a {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--ink);
      background: var(--panel);
      text-decoration: none;
      font-size: 13px;
    }

    .status-line {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar, .grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
    }

    @media (max-width: 720px) {
      .topbar, .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .context-grid, .metrics {
        grid-template-columns: 1fr 1fr;
      }

      .context-grid button { width: 100%; }
      .health-row, .risk-bar, .event-line { grid-template-columns: 78px minmax(0, 1fr); }
      .health-row .badge, .risk-bar .badge, .event-line .badge { justify-self: start; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <strong>ShopOps Agent</strong>
        <span>Admin Console</span>
      </div>
      <nav class="nav" aria-label="Admin navigation">
        <a class="active" href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/tasks.html">Agent Tasks</a>
        <a href="/admin/audit.html">Audit Center</a>
        <a href="#">Reports</a>
        <a href="#">Tools</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>ShopOps Dashboard</h1>
          <div class="subtitle" id="generatedAt">Waiting for data</div>
        </div>
        <form class="context-grid" id="contextForm">
          <label>Tenant
            <input id="tenantId" value="1" inputmode="numeric">
          </label>
          <label>Shop
            <input id="shopId" value="1" inputmode="numeric">
          </label>
          <label>User
            <input id="userId" value="1" inputmode="numeric">
          </label>
          <label>Roles
            <input id="roles" value="ADMIN">
          </label>
          <button class="primary" type="submit">Refresh</button>
          <button id="resetContext" type="button">Reset</button>
        </form>
      </header>

      <section class="content">
        <div class="metrics" id="metrics"></div>

        <div class="grid">
          <section class="panel">
            <div class="panel-title">
              <h2>Task Operations</h2>
              <div class="action-row">
                <a href="/admin/audit.html?source=TASK">Audit Center</a>
                <button id="refreshBtn" type="button">Refresh</button>
              </div>
            </div>
            <div class="risk-bars" id="taskBars"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h2>System Health</h2>
              <span class="status-line" id="healthStatus"></span>
            </div>
            <div class="health-grid" id="healthGrid"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h2>Audit Risk</h2>
              <span class="status-line" id="riskTotal"></span>
            </div>
            <div class="risk-bars" id="riskBars"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h2>Recent Failures</h2>
              <a href="/admin/audit.html?eventStatus=FAILURE">Open Audit</a>
            </div>
            <div class="health-grid" id="failedEvents"></div>
          </section>
        </div>

        <div class="status-line" id="statusLine"></div>
      </section>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function headers() {
      return {
        "X-Tenant-Id": $("tenantId").value || "1",
        "X-Shop-Id": $("shopId").value || "1",
        "X-User-Id": $("userId").value || "1",
        "X-User-Roles": $("roles").value || "ADMIN"
      };
    }

    async function api(path) {
      const response = await fetch(path, { headers: headers() });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const body = await response.json();
      if (body.code && body.code !== 200) {
        throw new Error(body.message || `API ${body.code}`);
      }
      return body.data;
    }

    async function refreshAll() {
      setStatus("Loading dashboard");
      try {
        const [summary, health, risk] = await Promise.all([
          api("/api/admin/dashboard/summary"),
          api("/api/system/health"),
          api("/api/admin/audit/high-risk")
        ]);
        renderSummary(summary);
        renderHealth(health);
        renderRisk(risk);
        setStatus("Dashboard refreshed");
      } catch (error) {
        setStatus(error.message);
      }
    }

    function renderSummary(summary) {
      const metrics = summary.taskMetrics || {};
      $("generatedAt").textContent = `Generated ${formatTime(summary.generatedAt)}`;
      $("metrics").innerHTML = [
        ["Tasks", metrics.total],
        ["Success", metrics.success],
        ["Failed", metrics.failed],
        ["Reports", summary.reportTotal],
        ["Tool Calls", summary.toolCallTotal],
        ["Tool Failed", summary.toolCallFailed]
      ].map(([label, value]) => metric(label, value)).join("");

      const statusBreakdown = metrics.statusBreakdown || {};
      const taskTotal = Math.max(1, number(metrics.total));
      $("taskBars").innerHTML = [
        ["Success Rate", `${number(metrics.successRate).toFixed(1)}%`, number(metrics.successRate)],
        ["Avg Latency", `${number(metrics.avgLatencyMs)} ms`, Math.min(100, number(metrics.avgLatencyMs) / 20)],
        ["Pending", statusBreakdown.PENDING || 0, (number(statusBreakdown.PENDING) / taskTotal) * 100],
        ["Running", statusBreakdown.RUNNING || 0, (number(statusBreakdown.RUNNING) / taskTotal) * 100],
        ["Success", statusBreakdown.SUCCESS || 0, (number(statusBreakdown.SUCCESS) / taskTotal) * 100],
        ["Failed", statusBreakdown.FAILED || 0, (number(statusBreakdown.FAILED) / taskTotal) * 100]
      ].map(([label, value, percent]) => bar(label, value, percent)).join("");

      $("failedEvents").innerHTML = (summary.recentFailedEvents || []).map((event) => `
        <div class="event-line">
          <span>${escapeHtml(formatTime(event.createdAt))}</span>
          <strong>${escapeHtml(event.eventType || "TASK_FAILED")}</strong>
          <span class="badge failure">FAILURE</span>
        </div>
      `).join("") || `<div class="status-line">No recent failed events</div>`;
    }

    function renderHealth(health) {
      const checks = health.checks || {};
      $("healthStatus").textContent = `${health.status || "UNKNOWN"} / ${health.persistence || "memory"}`;
      $("healthGrid").innerHTML = ["database", "flyway", "redis", "rabbitmq"].map((name) => {
        const item = checks[name] || {};
        return `
          <div class="health-row">
            <span>${escapeHtml(name)}</span>
            <strong>${escapeHtml(item.mode || item.version || item.ping || "")}</strong>
            <span class="badge ${statusClass(item.status)}">${escapeHtml(item.status || "UNKNOWN")}</span>
          </div>
        `;
      }).join("");
    }

    function renderRisk(risk) {
      const breakdown = risk.riskBreakdown || {};
      const total = Math.max(1, Object.values(breakdown).reduce((sum, value) => sum + number(value), 0));
      $("riskTotal").textContent = `${number(risk.elevatedRiskTotal)} elevated / ${number(risk.total)} total`;
      $("riskBars").innerHTML = ["HIGH", "MEDIUM", "LOW", "UNKNOWN"].map((level) =>
        bar(level, breakdown[level] || 0, (number(breakdown[level]) / total) * 100, riskClass(level))
      ).join("");
    }

    function metric(label, value) {
      return `
        <div class="metric">
          <span>${escapeHtml(label)}</span>
          <strong>${number(value)}</strong>
        </div>
      `;
    }

    function bar(label, value, percent, badgeClass = "") {
      const width = Math.max(2, Math.round(number(percent)));
      return `
        <div class="risk-bar">
          <span>${escapeHtml(label)}</span>
          <div class="track"><div class="fill" style="width:${width}%"></div></div>
          <span class="badge ${badgeClass}">${escapeHtml(value)}</span>
        </div>
      `;
    }

    function setStatus(message) {
      $("statusLine").textContent = message;
    }

    function number(value) {
      return Number(value || 0);
    }

    function formatTime(value) {
      return value ? String(value).replace("T", " ").slice(0, 19) : "";
    }

    function statusClass(value) {
      return String(value || "unknown").toLowerCase();
    }

    function riskClass(value) {
      return String(value || "unknown").toLowerCase();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    $("contextForm").addEventListener("submit", (event) => {
      event.preventDefault();
      refreshAll();
    });

    $("resetContext").addEventListener("click", () => {
      $("tenantId").value = "1";
      $("shopId").value = "1";
      $("userId").value = "1";
      $("roles").value = "ADMIN";
      refreshAll();
    });

    $("refreshBtn").addEventListener("click", refreshAll);

    refreshAll();
  </script>
</body>
</html>
