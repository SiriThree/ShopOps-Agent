server:
  port: 8080

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-} tenant=%X{tenantId:-} shop=%X{shopId:-} user=%X{userId:-}] %logger{36} - %msg%n"

spring:
  application:
    name: shopops-admin
  flyway:
    enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shopops_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      initialization-fail-timeout: -1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis:
  configuration:
    map-underscore-to-camel-case: true

shopops:
  persistence: memory
  p0:
    tenant-id: 1
    shop-id: 1
    user-id: 1
